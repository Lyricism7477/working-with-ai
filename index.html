<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>AI Basics Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Ocean Teal masthead with a Fredrickson brand stripe (extended palette) from the Fredrickson job aids, then one reading column of lesson blocks. */
:root{
  --bg:#FFFFFF; --surface:#EEF4F4; --ink:#20383E; --muted:#597075; --line:#D6E0DF;
  --brand:#136977; --brand-ink:#136977; --band:#FFFFFF; --band-ink:#136977; --on-brand:#ffffff;
  --focus:#136977; --field-line:#597075; --btn-edge:transparent; --accent:#54B7CA; --accent-soft:#E7F5F8; --on-accent:#0B3D45; --band-kicker:#136977; --callout:#FFF8DD; --callout-ink:#20383E; --callout-label:#A15D06; --keypoint:#A15D06; --rule:#FF9C01; --eyebrow:#136977;
  --good:#364F00; --good-soft:#EDF6DB; --bad:#6B4200; --bad-soft:#FFF1DB;
  --shadow:0 1px 3px rgba(11,61,69,.14);
  --font:Corbel,Calibri,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  --font-head:"Century Gothic","Avenir Next",Futura,Corbel,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F2427; --surface:#20383E; --ink:#EEF4F4; --muted:#ADD8DF; --line:#34525A;
  --brand:#136977; --brand-ink:#8ECFDC; --band:#0B3D45; --band-ink:#ffffff; --on-brand:#ffffff;
  --focus:#54B7CA; --field-line:#5E8A93; --btn-edge:#54B7CA; --accent:#54B7CA; --accent-soft:#123F47; --on-accent:#0B3D45; --band-kicker:#8ECFDC; --callout:#3A3108; --callout-ink:#FFF8DD; --callout-label:#FEDF5D; --keypoint:#FFBE57; --rule:#FF9C01; --eyebrow:#8ECFDC;
  --good:#ACD357; --good-soft:#26380A; --bad:#FFBE57; --bad-soft:#3D2A08;
  --shadow:0 1px 3px rgba(0,0,0,.4); --art-blend:normal; --art-radius:16px; --art-mask:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F2427; --surface:#20383E; --ink:#EEF4F4; --muted:#ADD8DF; --line:#34525A;
  --brand:#136977; --brand-ink:#8ECFDC; --band:#0B3D45; --band-ink:#ffffff; --on-brand:#ffffff;
  --focus:#54B7CA; --field-line:#5E8A93; --btn-edge:#54B7CA; --accent:#54B7CA; --accent-soft:#123F47; --on-accent:#0B3D45; --band-kicker:#8ECFDC; --callout:#3A3108; --callout-ink:#FFF8DD; --callout-label:#FEDF5D; --keypoint:#FFBE57; --rule:#FF9C01; --eyebrow:#8ECFDC;
  --good:#ACD357; --good-soft:#26380A; --bad:#FFBE57; --bad-soft:#3D2A08;
  --shadow:0 1px 3px rgba(0,0,0,.4); --art-blend:normal; --art-radius:16px; --art-mask:none; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
h1,h2,h3,.wordmark,.lrow .t{font-family:var(--font-head)}
a{color:var(--brand-ink);text-underline-offset:2px}
b{font-weight:700}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}

.top{position:relative;z-index:3;background:var(--band);color:var(--band-ink);border-bottom:6px solid;border-image:linear-gradient(90deg,#FF9C01 0 20%,#FDCF0A 20% 40%,#81BD00 40% 60%,#1B92A5 60% 80%,#54B7CA 80% 100%) 1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:760px;margin:0 auto;padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{font-weight:800;font-size:19px;letter-spacing:-.2px;color:var(--band-ink);text-decoration:none}
.kicker{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--band-kicker)}

.wrap{max-width:720px;margin:0 auto;padding-block:32px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1{font-size:34px;line-height:1.15;letter-spacing:-.6px;color:var(--brand-ink);margin:0;text-wrap:balance}
h2{font-size:23px;line-height:1.25;color:var(--brand-ink);margin:0;text-wrap:balance}
h3{font-size:19px;color:var(--brand-ink);margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.lede{font-size:19px;color:var(--muted);max-width:62ch}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--eyebrow)}

/* Home */
.home{display:flex;flex-direction:column;gap:28px}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:l}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lrow .num{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.lrow .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .t{font-weight:700;font-size:18px;color:var(--brand-ink)}
.lrow .b{font-size:16px;margin-top:2px}
.lrow .m{font-size:15px;color:var(--muted)}
.lrow .pm{font-size:15px;color:var(--muted)}
.lrow.pre:not(.done) .num{background:var(--bg);border:2px solid var(--brand)}
.lrow.done .num{background:var(--good);color:var(--on-brand)}
.chip{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
@media (max-width:520px){.lrow{grid-template-columns:40px 1fr}.lrow .go{grid-column:1 / -1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 20px;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer;text-decoration:none;min-height:44px;box-shadow:inset 0 0 0 2px var(--btn-edge)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--brand-ink);border:1.5px solid var(--line);box-shadow:none}

/* Title band, as in Rise: a light teal band behind the page title that runs to the edges of the page. */
.hero{background:var(--surface);padding:8px 0 36px;box-shadow:0 0 0 100vmax var(--surface);clip-path:inset(-100vmax -100vmax 0 -100vmax);margin-bottom:12px}
/* Title art: one illustration beside the title on wide screens, under it on phones. The title text sits in its own column, centered on the art.
   Multiply drops the image's white background into the band, and the soft mask fades the image's edges so no box shows. */
.hero.has-art{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);column-gap:40px;align-items:center}
.hero-art{width:100%;height:auto;mix-blend-mode:var(--art-blend,multiply);border-radius:var(--art-radius,0);
  --edge:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 7%,#000 93%,transparent);
  -webkit-mask-image:var(--art-mask,var(--edge));mask-image:var(--art-mask,var(--edge));-webkit-mask-composite:source-in;mask-composite:intersect}
@media (max-width:700px){.hero.has-art{display:flex;flex-direction:column;align-items:stretch;gap:14px}.hero-art{width:min(100%,340px);align-self:center}}
/* Over the title band, the top bar takes the band's color, so the title scrolls under it instead of showing through. */
.where:not(.on){background:var(--surface)}
/* Interactive blocks: a shaded band edge to edge, with the white card on it. Bands next to each other join into one. */
.ishade{background:var(--surface);padding:32px 0;box-shadow:0 0 0 100vmax var(--surface);clip-path:inset(0 -100vmax)}
.ishade + .ishade{margin-top:-32px;padding-top:0}

/* Lesson */
.lesson-head{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.frame{display:flex;flex-direction:column;gap:12px;font-size:17px}
.frame p{margin:0}
.frame ol.list{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.fits{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.why{font-size:19px;line-height:1.5;color:var(--muted);margin-top:-4px;max-width:62ch;text-wrap:pretty}
.where{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid transparent;font-size:14px;font-weight:700;color:var(--brand-ink);opacity:0;pointer-events:none;transition:opacity .15s}
.where.on{opacity:1;border-bottom-color:var(--line)}
@media (prefers-reduced-motion:reduce){.where{transition:none}}
.scenario{border-left:3px solid var(--accent);padding:4px 0 4px 18px;font-size:17px;margin:0}
.goal{border-left:3px solid var(--accent);padding:4px 0 4px 18px;font-size:16.5px}
.seg{display:flex;flex-direction:column;gap:32px;padding-top:40px}
.gate{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.statement{font-size:inherit;line-height:1.55;font-weight:700;color:var(--keypoint);background:none;border-top:3px solid var(--rule);border-bottom:3px solid var(--rule);border-radius:0;padding:18px 0 20px;max-width:none;text-wrap:pretty}
.statement::before{content:"Key point";display:block;margin-bottom:4px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--keypoint)}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 18px}
.note.skip{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.tbl{overflow-x:auto}
/* Fredrickson callouts share the brand stripe: "At Fredrickson" facts, "Job aid" pointers and "Set up" steps. */
.frd,.howto{border-top:5px solid;border-image:linear-gradient(90deg,#FF9C01 0 20%,#FDCF0A 20% 40%,#81BD00 40% 60%,#1B92A5 60% 80%,#54B7CA 80% 100%) 1;background:var(--surface)}
.frd{padding:14px 18px}
.frd-label{margin:0 0 4px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--eyebrow)}
.ico{display:flex;align-items:center;gap:7px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h2.ico{gap:10px}h2 .icon{width:26px;height:26px}.howto{margin-top:14px;border-radius:0}
.howto .copybox{background:var(--bg)}
.howto>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--brand-ink)}
.howto>.body{padding:0 14px 12px}
.copybox{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:10px 0}
.fine{font-size:14px;color:var(--muted)}
.copybox .copytext{margin:0 0 8px;white-space:pre-wrap}
.copybtn{font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--bg);color:var(--brand-ink);cursor:pointer}
.models table{table-layout:fixed}.models thead th:first-child{width:24%}
@media (max-width:600px){.models thead{display:none}.models tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.models td{display:block;border:0;padding:3px 0}.models td+td::before{content:attr(data-l);display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}}
.cmp table{min-width:640px;table-layout:fixed}
.cmp thead th{font-size:16px;letter-spacing:0;text-transform:none;color:var(--brand-ink);font-weight:800;border-bottom:2px solid var(--accent)}
.cmp thead th:first-child{width:18%}
.cmp tbody th{font-size:15px;line-height:1.35;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
.cmp td.yes{background:var(--accent-soft);font-weight:700}
/* Phones: keep the row labels in view while the table scrolls sideways. */
@media (max-width:600px){.cmp thead td:first-child,.cmp tbody th{position:sticky;left:0;z-index:1;background:var(--bg);box-shadow:2px 0 0 var(--line)}}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.app{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg);box-shadow:var(--shadow)}
.app h3{margin:0 0 10px;font-size:19px;color:var(--brand-ink)}
.app dl{margin:0;display:flex;flex-direction:column;gap:10px}
.app dt{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.app dd{margin:2px 0 0}
ul.list{margin:0;padding-left:44px;display:flex;flex-direction:column;gap:6px}
p:empty,h2:empty,h3:empty,li:empty{display:none}

/* Knowledge check */
.kc{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.kc .q{font-weight:700;font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1.5px solid var(--field-line);border-radius:8px;background:var(--bg);cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--brand);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:8px;font-size:16px}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb b{color:inherit}
textarea.write{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--field-line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical}

/* Sorting */
.sort{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.deck{min-height:96px;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg);border:1.5px solid var(--brand);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow);max-width:440px;width:100%;text-align:center;font-weight:600;cursor:grab;touch-action:none;user-select:none}
.card.dragging{cursor:grabbing;position:relative;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.piles{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
@media (max-width:560px){.piles{grid-template-columns:1fr}}
.pile{border:1.5px dashed var(--field-line);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink);min-height:56px}
.pile.over{border-color:var(--accent);background:var(--accent-soft)}
.pile .pn{font-weight:800;color:var(--brand-ink)}
.pile ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pile li{font-size:14.5px;padding:6px 10px;border-radius:6px;background:var(--good-soft);border-left:3px solid var(--good)}
.sort .status{font-size:15.5px;min-height:1.6em}
.sort .tip{font-size:14px;color:var(--muted)}
.sim{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sim > .eyebrow{color:var(--brand-ink)}
.simcount{margin:0;align-self:flex-start;font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--on-brand);background:var(--brand);border-radius:20px;padding:3px 12px}
.simwin{border:1.5px solid var(--brand);border-radius:12px;background:var(--bg);overflow:hidden;box-shadow:0 6px 18px rgba(11,61,69,.16)}
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-bottom:3px solid var(--accent);background:#0B3D45;color:var(--on-brand)}
.simapp{font-weight:800;color:var(--on-brand);font-size:15px;display:flex;align-items:center;gap:8px}
.simapp::before{content:"AI";display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.simsp{flex:1}
.simlab{font-size:13px;font-weight:700;color:var(--on-brand);opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.simset{display:flex;border:1.5px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
.simset label{position:relative;display:flex;cursor:pointer}
.simset label + label{border-left:1.5px solid rgba(255,255,255,.45)}
.simset input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.simset span{padding:8px 12px;font-size:15px;font-weight:600;color:var(--on-brand);min-height:28px;display:flex;align-items:center}
.simset label:hover span{background:rgba(255,255,255,.12)}
.simset input:checked + span{background:var(--accent);color:var(--on-accent);font-weight:800}
.simset input:focus-visible + span{outline:3px solid #ffffff;outline-offset:-4px}
.simthread{display:flex;flex-direction:column;gap:12px;padding:16px}
.simyou{align-self:flex-end;max-width:85%;background:var(--brand);color:var(--on-brand);border-radius:12px 12px 2px 12px;padding:10px 14px}
.simyou p{margin:0}
.simfile{font-size:14px;opacity:.85;margin-top:4px!important}
.simreply{max-width:100%;display:flex;flex-direction:column;gap:8px;min-height:40px;border-left:3px solid var(--accent);padding-left:14px}
.simreply p{margin:0}
.simreply.thinking .simmeta{color:var(--brand-ink);font-weight:600}
.simdots{display:inline-flex;gap:4px;margin-right:2px}
.simdots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:simdot 1s ease-in-out infinite}
.simdots i:nth-child(2){animation-delay:.15s}
.simdots i:nth-child(3){animation-delay:.3s}
@keyframes simdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.simthread{min-height:240px}
.simreply:empty{display:none}
.simhello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 0}
.simlogo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:19px}
.simhi{margin:0 0 6px;font-size:21px;font-weight:700;color:var(--brand-ink)}
.simsys{align-self:center;margin:0;font-size:13.5px;font-weight:600;color:var(--brand-ink);background:var(--accent-soft);border-radius:20px;padding:3px 12px}
.simyou.in,.simsys.in{animation:simin .3s ease-out}
.simnote{animation:simin .35s ease-out}
@keyframes simin{from{opacity:0;transform:translateY(8px)}}
.siminput{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.simfield{flex:1;min-height:24px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;background:var(--bg);color:var(--ink);font-size:15.5px}
.simfield.typing{border-color:var(--accent)}
.simfield.typing .simtyped::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:text-bottom;background:var(--ink);animation:simcaret 1s steps(1) infinite}
@keyframes simcaret{50%{opacity:0}}
.simph{color:var(--muted)}
.simchip{font-size:13.5px;font-weight:600;color:var(--brand-ink);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.simsend{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:18px;transition:transform .15s}
.simsend.press{transform:scale(.82);background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:reduce){.simdots i,.simyou.in,.simsys.in,.simnote,.simfield.typing .simtyped::after{animation:none}}
.simmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.simuse{display:inline-flex;gap:3px}
.simuse i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.simuse i.on{background:var(--accent)}
.simbody table{border-collapse:collapse;font-size:15.5px;width:auto}
.simbody th,.simbody td{padding:4px 12px 4px 0}
.simbody th{font-size:13px;color:var(--brand-ink)}
.simnote{font-size:15.5px;padding:8px 12px;border-radius:8px;border-left:4px solid var(--line);background:var(--surface)}
.simnote.good{border-left-color:var(--good);background:var(--good-soft)}
.simnote.poor{border-left-color:var(--bad);background:var(--bad-soft)}
.simnote.ok{border-left-color:var(--accent);background:var(--accent-soft)}

/* Tabs */
.tabs{border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:var(--shadow);padding:6px 20px 20px}

.panel{padding:18px 0 0;display:flex;flex-direction:column;gap:12px}
/* Left-aligned tabs: hint, tab labels and content share one left edge. */

.ltabs .tab{flex:0 0 auto;padding:12px 14px}
.ltabs .tab:first-child{padding-left:0}
.ltabs .panel>p:first-child{margin-top:0}
/* Quiet list: a label on the left, the text on the right, thin lines between rows. Stacks on a phone. */
.qlist{margin:0;padding:0}
/* App comparison: questions down the left, apps across the top, alternating row shading. */
.appt{border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:var(--shadow);padding:8px;overflow:hidden}
.appt table{table-layout:fixed;font-size:15px;line-height:1.5}
.appt th,.appt td{padding:12px 10px;border:0;vertical-align:top;letter-spacing:0;text-transform:none;color:var(--ink)}

.appt thead td{width:27%}
.appt tbody th{font-size:15px;font-weight:700}
.appt tbody tr.open>td:nth-child(even){background:var(--surface)}
.appt tbody th,.appt tbody td{border-top:1px solid var(--line)}
.appt tbody tr:not(.open) .ans{display:none}
.appt tbody th button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;color:var(--link);font-weight:700}
.appt tbody th button::before{content:"+";font-size:20px;line-height:1.1;width:14px;flex:none;color:var(--accent);font-weight:800}
.appt tbody th button:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:4px}
.appt tbody tr.open th button::before{content:"−"}
.appt tbody tr:not(.open){cursor:pointer}
@media (max-width:600px){.appt{padding:4px}.appt thead{display:none}.appt table,.appt tbody,.appt tr,.appt th,.appt td{display:block;width:auto}
  .appt tbody tr{padding:6px 0;border-top:1px solid var(--line)}.appt tbody tr:first-child{border-top:0}
  .appt tbody tr.open>td:nth-child(even){background:none}.appt tbody th,.appt tbody td{border-top:0}
  .appt tbody th{padding:8px 12px 4px;font-size:16px}.appt td{padding:4px 12px}
  .appt td::before{content:attr(data-app);display:block;font-weight:700;font-size:14px;color:var(--muted)}
  .appt tbody tr:not(.open) td{display:none}}
.qrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 20px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0;padding-top:4px}
.qrow dt{margin:0}
.qrow dt b{display:block;font-size:17px;color:var(--brand-ink)}
.qrow dt span{display:block;font-size:14px;color:var(--muted)}
.qrow dt .nolic{color:var(--bad);font-weight:700}
.qrow dd{margin:0;font-size:16px;line-height:1.5}
.qrow dd .watch{display:block;margin-top:4px;font-size:15px;color:var(--muted)}
.qrow.hi dd{font-weight:700;color:var(--brand-ink)}
.qlist.sm .qrow dt b{font-size:15px}
@media (max-width:520px){.ltabs .tablist{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.ltabs .tab{padding:10px 0;text-align:left}.qrow{grid-template-columns:1fr}.qrow dt b,.qrow dt span{display:inline}.qrow dt span::before{content:" · "}}
/* Accordion group: one box, thin lines between items. */
.accg{border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:var(--shadow)}
.accg details.acc{border:0;border-radius:0;background:transparent;border-top:1px solid var(--line)}
.accg details.acc:first-child{border-top:0}

[hidden]{display:none !important}

/* Accordion */
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--bg)}

details.acc>summary::before{content:"+";font-size:20px;width:20px;color:var(--accent);font-weight:800}
details.acc[open]>summary::before{content:"\2212"}
details.acc .body{padding:0 18px 16px 48px}

/* Process */
.proc{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:6px}
.dots span{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--accent)}

.pset{display:flex;flex-direction:column;gap:14px}

/* Decision flowchart (Lesson 1, Part 4). Compact layout from the ChatGPT mock Emily chose (Nov 23, 2026), with our filled concept colors on the cards.
   Subgrid rows keep the two questions the same height and the dividers in all four cards on one line. */
.flow{container-type:inline-size;font-size:14px;line-height:1.4;margin:0}
.flow .fq{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 16px;text-align:center;font-weight:700;font-size:15.5px;line-height:1.35;color:var(--ink);display:flex;align-items:center;justify-content:center}
.flow .fq1{max-width:320px;margin:0 auto;min-height:60px;box-sizing:border-box}
.flow .fsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,auto);column-gap:20px;position:relative;padding-top:12px}
.flow .fsplit::before,.flow .fleaves::before{content:"";position:absolute;top:12px;left:calc((100% - 20px)/4);right:calc((100% - 20px)/4);height:1.5px;background:var(--muted)}
.flow .fsplit::after,.flow .fleaves::after{content:"";position:absolute;top:0;left:50%;width:1.5px;height:12px;background:var(--muted)}
.flow .fhalf{display:grid;grid-row:1/-1;grid-template-rows:subgrid;min-width:0}
.flow .fbl{margin:0;position:relative;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink);padding:16px 0 10px}
.flow .fbl::before,.flow .fbl::after{content:"";position:absolute;left:50%;width:1.5px;background:var(--muted)}
.flow .fbl::before{top:0;height:12px}
.flow .fbl::after{bottom:0;height:8px}
.flow .fbl b{text-transform:uppercase;letter-spacing:.6px}
.flow .fbl .sep{margin:0 6px;color:var(--muted)}
.flow .fleaves{display:grid;grid-row:span 3;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:subgrid;column-gap:12px;position:relative;padding-top:12px}
.flow .fleaves::before{left:calc((100% - 12px)/4);right:calc((100% - 12px)/4)}
.flow .fcol{display:grid;grid-row:span 3;grid-template-rows:subgrid;min-width:0}
.flow .yn{justify-self:center;position:relative;margin:12px 0 8px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:1px 12px;min-width:72px;text-align:center;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.flow .yn::before{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:12px;background:var(--muted)}
.flow .leaf{display:grid;grid-row:span 2;grid-template-rows:subgrid;border-radius:8px;border-top:4px solid;padding:12px 14px 14px}
.flow .lh{padding-bottom:10px;border-bottom:1px solid var(--line)}
.flow .ln{margin:0;font-weight:800;font-size:15.5px;color:var(--ink)}
.flow .lw{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.flow .leaf ul{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.35}
.flow .leaf li b{display:block;color:var(--ink)}
.flow .leaf li span{color:var(--muted)}
/* Narrow: the two halves stack. Each half keeps its question and two cards. */
@container (max-width:600px){
  .flow .fsplit{grid-template-columns:1fr;grid-template-rows:none;padding-top:0}
  .flow .fsplit::before,.flow .fsplit::after{display:none}
  .flow .fhalf{grid-row:auto;grid-template-rows:none}
  .flow .fleaves{grid-row:auto;grid-template-rows:auto auto auto}
  .flow .fhalf+.fhalf{margin-top:18px;padding-top:6px;border-top:1px dashed var(--line)}
  .flow .fhalf+.fhalf .fbl::before{display:none}
  .flow .fhalf+.fhalf .fbl{padding-top:4px}
}
/* Small phones: one card per row. */
@container (max-width:380px){
  .flow .fleaves{grid-template-columns:1fr;grid-template-rows:none;row-gap:4px}
  .flow .fleaves::before{display:none}
  .flow .fcol{grid-row:auto;grid-template-rows:none}
  .flow .leaf{grid-row:auto;grid-template-rows:none}
  .flow .fcol+.fcol .yn::before{display:none}
}

/* Flashcards */
.termdef{margin:6px 0 0}

/* Model menu illustration */
.mock{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.mock{grid-template-columns:1fr}}
.win{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);font-size:15px}

/* Term match: terms and definitions stay face up. The learner selects a term, then its definition, in either order.
   Teal = a card to click, filled teal = the selected card. Green with a check = a matched pair. Marigold = not a match. */
.om{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
.om-col{display:flex;flex-direction:column;gap:8px}
.om-head{margin:0;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.omcard{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--link);border-radius:8px;background:var(--accent-soft);padding:9px 12px;font-size:15px;line-height:1.45;color:var(--ink);text-align:left}
.omcard.term{font-weight:700}
.omcard[aria-pressed="true"]{background:var(--link);color:var(--bg)}
.omcard.found{border-color:var(--good);background:var(--good-soft);color:var(--ink);cursor:default}
.omcard.found.term::before{content:"¹3␀a0";color:var(--good)}
.omcard .om-tag{display:block;font-weight:700}
.omcard.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.omcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.omstat{font-size:15px;color:var(--muted);margin:0}
.omfb:empty{display:none}
@media (max-width:560px){.om{grid-template-columns:1fr}.om-terms{flex-direction:row;flex-wrap:wrap}.om-terms .om-head{flex-basis:100%}.omcard{font-size:14.5px}}

@media (prefers-reduced-motion:reduce){.card.shake{animation:none}}

/* Course outline: a fixed left column on wide screens, a drawer from the Contents button on phones. */
.outline{display:none}
.where{display:flex;align-items:center;justify-content:flex-start;gap:8px}
.where .wlabel{min-width:0}
body.in-lesson .where{opacity:1;pointer-events:auto}
.burger{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-6px 0 -6px -10px;padding:0;border:0;border-radius:8px;background:none;color:var(--brand-ink);cursor:pointer}

.burger svg{width:24px;height:24px}
@media (min-width:1100px){
  body.in-lesson:not(.outline-closed) .shell{display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
  body.in-lesson:not(.outline-closed) .outline{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
  body.in-lesson .wrap{width:100%}
  /* The side menu already shows the course title, so the top band shrinks to its color stripe. */
  body.in-lesson:not(.outline-closed) .top-in{display:none}
  /* Menu open: its button is at the top of the menu. Menu closed: the button sits at the page's top left. */
  body.in-lesson:not(.outline-closed) .where .burger{display:none}
  body.in-lesson.outline-closed .where .burger{position:fixed;top:12px;left:16px;margin:0;background:var(--bg)}
}
/* Side menu, modeled on Rise: course title and progress on top, then a flat list of lessons with a status ring on the right. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.oside-top{padding:12px 14px 0}

.onav{padding:28px 0 40px;display:flex;flex-direction:column}

.otitle:hover{color:var(--brand-ink)}
.oprog{margin:14px 24px 22px}
.oprog-t{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

.olesson>a:hover{background:var(--accent-soft)}

.oring svg{width:10px;height:10px}
.oparts{list-style:none;margin:0;padding:0 0 8px;background:var(--bg)}

dialog.drawer{margin:0;inset:0 auto 0 0;height:100%;max-height:none;width:min(340px,88vw);max-width:none;padding:0;border:0;background:var(--surface);color:var(--ink);overflow-y:auto}
dialog.drawer::backdrop{background:rgba(11,61,69,.5)}
.drawer-top{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-start;padding:10px 14px 10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer .onav{padding-top:12px}
section.seg h2{scroll-margin-top:64px}
section.seg h2:focus{outline:none}
.fb .why-head{margin-top:8px;font-weight:600}
/* Color jobs (Nov 22, 2026): each color has one job, everywhere. Teal = you can click it. Tangerine = your turn. Green = right or done. Marigold = not quite or a caution. Diagram colors = one per idea. */
:root{--link:#136977;--turn:#FF9C01;--turn-ink:#6B4200;--brand-ink:#20383E;--eyebrow:#597075;--bad:#6A5704;--bad-soft:#FFF8DD;--note-line:#D6E0DF;
  --c-chat:#8AA04A;--c-chat-soft:#F6FAEA;--c-proj:#E08109;--c-proj-soft:#FBEDDD;--c-agent:#B8AE3A;--c-agent-soft:#FFFDE7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:#8ECFDC;--turn:#FFBE57;--turn-ink:#FFBE57;--brand-ink:#EEF4F4;--eyebrow:#ADD8DF;--bad:#FEDF5D;--bad-soft:#3A3108;--note-line:#34525A;
  --c-chat-soft:#2A3214;--c-proj-soft:#3A2504;--c-agent-soft:#33300F}}
:root[data-theme="dark"]{--link:#8ECFDC;--turn:#FFBE57;--turn-ink:#FFBE57;--brand-ink:#EEF4F4;--eyebrow:#ADD8DF;--bad:#FEDF5D;--bad-soft:#3A3108;--note-line:#34525A;
  --c-chat-soft:#2A3214;--c-proj-soft:#3A2504;--c-agent-soft:#33300F}
/* 1. Teal means "you can click this." Headings and labels go Deep Ink; only controls keep teal. */
a,.otitle:hover,.howto>summary,details.acc>summary,.btn.ghost,.copybtn,.burger,.tab[aria-selected="true"],.oparts button[aria-current],.olesson.cur .num,.pile .pn{color:var(--link)}
.tab[aria-selected="true"]{border-bottom-color:var(--link)}
.scenario,.goal,.note{border-left-color:var(--note-line)}
.statement,.statement::before{color:var(--ink)}
.statement{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.statement::before{color:var(--muted)}
.frd{border-top:0;border-image:none}
.frd-label{color:var(--ink)}
/* 2. Tangerine means "your turn": every activity gets a Tangerine top edge and label. */
.kc,.sort,.sim{box-shadow:var(--shadow),inset 0 4px 0 var(--turn)}
.kc>.eyebrow,.sort>.eyebrow,.sim>.eyebrow,.kc .eyebrow{color:var(--turn-ink)}
/* 3. Green means right or done; Marigold means "not quite" or a caution. Always with a word. */
.olesson.done .oring{border-color:var(--good);background:var(--good)}
.oprog-bar span{background:var(--good)}
/* 5. Concept colors live only inside diagrams: chat, project and agent keep one color each. */
.flow .leaf[data-leaf="chat"]{border-top-color:var(--c-chat);background:var(--c-chat-soft)}
.flow .leaf[data-leaf="project"]{border-top-color:var(--c-proj);background:var(--c-proj-soft)}
.flow .leaf[data-leaf="docs"],.flow .leaf[data-leaf="code"]{border-top-color:var(--c-agent);background:var(--c-agent-soft)}
/* File map (Lesson 2, Part 2): the four ways to give the AI a file, in two groups. Matches the ChatGPT mock Emily chose (Nov 23, 2026).
   Warm = a copy; seafoam = the current file. Both boxes share one set of rows, so their dividers line up. */
:root{--fm-copy:#E5B560;--fm-copy-soft:#FBF8EE;--fm-live:#3D9CA4;--fm-live-soft:#EEF8F7;--fm-label:#106D7A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fm-copy-soft:#3A2F14;--fm-live-soft:#163A3C;--fm-label:#8ECFDC}}
:root[data-theme="dark"]{--fm-copy-soft:#3A2F14;--fm-live-soft:#163A3C;--fm-label:#8ECFDC}
.fmap-label{margin:24px 0 12px;font-size:13px;line-height:1.4;letter-spacing:1.1px;font-weight:700;text-transform:uppercase;color:var(--fm-label)}
.fmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto;column-gap:20px;margin:0 0 20px}
.fmap .fg{display:grid;grid-row:span 3;grid-template-rows:subgrid;border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0;background:var(--bg)}
.fmap .fg-copy{border-top:3px solid var(--fm-copy)}
.fmap .fg-live{border-top:3px solid var(--fm-live)}
.fmap .fg-head{padding:16px 20px 14px}
.fmap .fg-copy .fg-head{background:var(--fm-copy-soft)}
.fmap .fg-live .fg-head{background:var(--fm-live-soft)}
.fmap h3{margin:0 0 2px;font-family:var(--font);font-size:20px;line-height:1.3;color:var(--ink)}
.fmap .fg-head p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.fmap ul{display:grid;grid-row:span 2;grid-template-rows:subgrid;list-style:none;margin:0;padding:0 18px}
.fmap li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:center;padding:20px 0}
.fmap li+li{border-top:1px solid var(--line)}
.fmap li svg{width:56px;height:56px;display:block}
.fmap h4{margin:0 0 2px;font-family:var(--font);font-size:18px;line-height:1.35;color:var(--ink)}
.fmap li p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.fmap li p b{color:var(--ink)}
@media (max-width:700px){.fmap{grid-template-columns:1fr;grid-template-rows:none;row-gap:14px}.fmap .fg,.fmap ul{grid-row:auto;grid-template-rows:none}}
/* Visual batch 3 (Nov 23, 2026): static pictures from ChatGPT's mocks at four spots. Labels are HTML text; the pictures only decorate.
   Card colors use the diagram tones from the file map, not tangerine (your turn) or green (right or done). */
.vis-label{margin:24px 0 12px;font-size:13px;line-height:1.4;letter-spacing:1.1px;font-weight:700;text-transform:uppercase;color:var(--fm-label)}
.vis{container-type:inline-size;margin:0 0 8px}
.vis ul{list-style:none;margin:0;padding:0}
.vis svg{display:block;flex:none}
.vis h4{margin:0 0 2px;font-family:var(--font);font-size:17px;line-height:1.35;color:var(--ink)}
.vis li p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.vis .vis-note{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
.vis-three ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;border-top:2px solid var(--ink);padding-top:16px}
.vis-three svg{width:96px;height:77px;margin:0 0 10px -6px}
.vis-three .vis-note{padding-bottom:14px;border-bottom:2px solid var(--ink)}
.vis-pair ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vis-pair li{display:flex;align-items:center;gap:16px;padding:18px 18px 18px 14px;border-left:3px solid var(--fm-live);background:var(--fm-live-soft);border-radius:0 7px 7px 0}
.vis-pair li.warm{border-left-color:var(--fm-copy);background:var(--fm-copy-soft)}
.vis-pair svg{width:88px;height:68px}
.vis-both ul{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.vis-both li{display:flex;align-items:center;gap:14px}
.vis-both li.and{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink);justify-content:center}
.vis-both svg{width:76px;height:61px}
@container (max-width:560px){
  .vis-three ul{grid-template-columns:1fr;gap:14px}
  .vis-three li{display:flex;align-items:center;gap:14px}
  .vis-three svg{width:72px;height:58px;margin:0}
  .vis-pair ul{grid-template-columns:1fr;gap:12px}
  .vis-pair svg{width:72px;height:56px}
  .vis-both ul{grid-template-columns:1fr;gap:10px}
  .vis-both li.and{justify-content:flex-start;padding-left:20px}
  .vis-both svg{width:64px;height:51px}
}
</style>
