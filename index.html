/* ---------- lesson ---------- */
function renderLesson(n){
  const ls = LESSONS[n];
  document.title = "Lesson "+(n+1)+": "+ls.title;
  const ctx = { interactives: [], checks: [], scoreEls: [], last: n === LESSONS.length - 1 };
  const root = el("div");
  const head = el("div","lesson-head");
  const back = el("nav","backnav"); back.setAttribute("aria-label","Course");
  back.append(Object.assign(el("a","backlink","← All lessons"),{href:"#home"}));
  if(n > 0) back.append(Object.assign(el("a","backlink",`← Lesson ${n}`),{href:"#lesson-"+n}));
  head.append(back);
  head.append(el("p","eyebrow",`Lesson ${n+1} of ${LESSONS.length}, ${ls.min} minutes`));
  head.append(el("h1",null,ls.title));
  const frame = el("div","frame");
  frame.append(el("p",null,ls.intro));
  const parts = ls.blocks.filter(b => b.t === "h" && /^Part \d/.test(b.text)).map(b => `<li>${b.text.replace(/^Part \d+\. /,"")}</li>`).join("");
  frame.append(el("div",null,`<p><b>In this lesson</b></p><ol class="list">${parts}</ol>`));
  head.append(frame);
  if(ls.scenario) head.append(el("p","scenario",`<b>The example.</b> ${ls.scenario}`));
  root.append(head);

  // split into segments at gates
  const segs = [[]];
  ls.blocks.forEach(b => { if(b.t === "gate") segs.push([]); else segs[segs.length-1].push(b); });
  const segEls = segs.map((blocks, si) => {
    const s = el("section","seg"); if(si > 0) s.hidden = true;
    blocks.forEach(b => { const node = renderBlock(b, ctx, si, n); if(node) s.append(node); });
    if(si < segs.length - 1){
      const g = el("div","gate");
      const btn = el("button","btn","Continue"); btn.type = "button";
      const hint = el("span","hint","Finish the activity above to continue.");
      g.append(btn, hint); s.append(g);
      ctx["gate"+si] = {btn, hint};
      btn.addEventListener("click", () => {
        g.remove(); segEls[si+1].hidden = false;
        segEls[si+1].scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
      });
    }
    return s;
  });
  segEls.forEach(s => root.append(s));
  app.replaceChildren(root);
  ctx.update = () => {
    segs.forEach((_, si) => {
      const g = ctx["gate"+si]; if(!g) return;
      const pending = ctx.interactives.filter(x => x.seg === si && !x.done).length;
      g.btn.disabled = pending > 0; g.hint.hidden = pending === 0;
    });
  };
  ctx.update();
  window.scrollTo(0,0);
}

function renderBlock(b, ctx, seg, n){
  switch(b.t){
    case "h": return el("h2",null,b.text);
    case "p": return el("p",null,b.html);
    case "statement": return el("p","statement",b.text);
    case "note": return el("div","note",b.html);
    case "table": {
      const w = el("div","tbl");
      w.innerHTML = `<table><thead><tr>${b.head.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>(i===0||b.plain)?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join("")}</tr>`).join("")}</tbody></table>`;
      return w;
    }
    case "compare": {
      const w = el("div","tbl cmp");
      const cell = c => c.startsWith("+") ? `<td class="yes">${c.slice(1)}</td>` : `<td>${c}</td>`;
      w.innerHTML = `<table><thead><tr><td></td>${b.cols.map(c=>`<th scope="col">${c}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr><th scope="row">${r[0]}</th>${r.slice(1).map(cell).join("")}</tr>`).join("")}</tbody></table>`;
      return w;
    }
    case "apps": {
      const w = el("div","apps");
      w.innerHTML = b.apps.map(r=>`<section class="app"><h3>${r[0]}</h3><dl>${b.labels.map((l,i)=>`<div><dt>${l}</dt><dd>${r[i+1]}</dd></div>`).join("")}</dl></section>`).join("");
      return w;
    }
    case "acc": { const d = el("details","acc"); d.innerHTML = `<summary>${b.title}</summary><div class="body">${b.html}</div>`; return d; }
    case "case": return caseBlock(b);
    case "apppick": return appPickBlock(ctx);
    case "flow": return flowBlock(ctx);
    case "practice": return practiceBlock(ctx, seg);
    case "mock": return mockBlock();
    case "tabs": return tabsBlock(b);
    case "process": return processBlock(b);
    case "cards": return cardsBlock(b);
    case "kc": return kcBlock(b, ctx, seg);
    case "sort": return sortBlock(b, ctx, seg);
    case "sim": return simBlock(b, ctx, seg);
    case "write": return writeBlock(b, ctx, seg);
    case "score": { const s = el("div","score"); s.hidden = true; ctx.scoreEls.push({s, pass:b.pass}); return s; }
    case "end": return endBlock(b, n);
  }
}

function appsOf(ctx){
  if(!ctx.apps){

    ctx.apps = saved.filter(k => APPS.some(([id]) => id === k));
    ctx.appSubs = [];
  }
  return ctx.apps;
}
function setApps(ctx, list){
  ctx.apps = list;
  try { localStorage.setItem(APPS_KEY, JSON.stringify(list)); } catch(e){}

}

    const on = APPS.filter(([id]) => ctx.apps.includes(id));
    intro.textContent = on.length
      ? "Use the flowchart to choose the option for each task. These questions do not count toward your score."
      : "Select at least one app above to see practice tasks for it.";
    holder.replaceChildren(...on.map(([id,name]) => sets[id] || (sets[id] = build(id, name))));

function practiceQ(b, parent, onDone){

  const q = el("p","q",b.q); q.id = name+"-q"; w.append(q);

  });
  const submit = el("button","btn","Submit"); submit.type="button"; submit.disabled = true;

function sortBlock(b, ctx, seg){
  const state = { seg, done:false }; ctx.interactives.push(state);
  const w = el("div","sort");
  w.append(el("p","eyebrow","Sort the cards"), el("p",null,`<b>${b.prompt}</b>`));
  const deck = el("div","deck"); const piles = el("div","piles"); const status = el("p","status"); status.setAttribute("aria-live","polite");
  const pileEls = b.piles.map((name,pi)=>{
    const p = el("div","pile"); p.dataset.pi = pi; p.tabIndex = 0; p.setAttribute("role","button");
    p.innerHTML = `<span class="pn">${name}</span><ul></ul>`;
    p.setAttribute("aria-label", "Put the card in "+name);
    p.addEventListener("click",()=>place(pi));
    p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); place(pi); } });
    piles.append(p); return p;
  });
  let k = 0, misses = 0;
  const card = el("div","card"); card.setAttribute("aria-live","polite");
  deck.append(card);
  function show(){
    if(k >= b.cards.length){
      card.remove(); deck.append(el("p",null,"All cards sorted."));
      pileEls.forEach(p=>{ p.removeAttribute("role"); p.removeAttribute("aria-label"); p.tabIndex = -1; p.style.cursor = "default"; });
      status.textContent = misses ? `Done. You placed ${b.cards.length - misses} of ${b.cards.length} cards right on the first try.` : `Done. You placed all ${b.cards.length} cards right on the first try.`;
      state.done = true; ctx.update(); return;
    }
    card.textContent = b.cards[k][0];
  }
  let missed = false;
  function place(pi){
    if(k >= b.cards.length) return;
    const [text, ans] = b.cards[k];
    if(pi === ans){
      pileEls[pi].querySelector("ul").append(el("li",null,text));
      status.textContent = "Correct. That card goes in " + b.piles[pi] + ".";
      if(missed) misses++; missed = false; k++; show();
    } else {
      missed = true;
      status.textContent = "Not quite. That card belongs in a different pile. Try again.";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    }
  }
  // drag with pointer events; selecting a pile also works
  let sx=0, sy=0, drag=false;
  card.addEventListener("pointerdown",e=>{ drag=true; sx=e.clientX; sy=e.clientY; card.setPointerCapture(e.pointerId); card.classList.add("dragging"); });
  card.addEventListener("pointermove",e=>{
    if(!drag) return;
    card.style.transform = `translate(${e.clientX-sx}px,${e.clientY-sy}px)`;
    const t = hit(e); pileEls.forEach(p=>p.classList.toggle("over", p===t));
  });
  const end = e=>{
    if(!drag) return; drag=false; card.classList.remove("dragging"); card.style.transform = "";
    const t = hit(e); pileEls.forEach(p=>p.classList.remove("over"));
    if(t) place(+t.dataset.pi);
  };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",()=>{ drag=false; card.classList.remove("dragging"); card.style.transform=""; });
  function hit(e){ card.style.visibility="hidden"; const t = document.elementFromPoint(e.clientX,e.clientY); card.style.visibility=""; return t ? t.closest(".pile") : null; }
  show();
  w.append(deck, piles, status, el("p","tip","Tip: on a phone or with a keyboard, select a pile to place the card."));
  return w;
}

  const ph = el("span","simph","Message the AI");
  const send = el("span","simsend","↑");
  field.append(chip, typed, ph); box.append(field, send);
  win.append(bar, rulebar, thread, box);
  const best = el("div","fb ok"); best.hidden = true; best.setAttribute("aria-live","polite");
  const hint = el("p","simnext"); hint.setAttribute("aria-live","polite");
  const nav = el("div","simnav");
  const unit = (b.unit || "Task").toLowerCase();
  const prev = el("button","btn ghost",`← Previous ${unit}`); prev.type = "button";
  const next = el("button","btn",`Next ${unit} →`); next.type = "button";
  nav.append(prev, next);
  prev.addEventListener("click", () => { if(k > 0){ k--; show(); } });
  next.addEventListener("click", () => { if(k < b.tasks.length - 1){ k++; show(); } });
  count.hidden = hint.hidden = nav.hidden = true;
  const key = el("p","simkey",b.key || ""); key.hidden = !b.key;
  w.append(count, task, win, key, nav);

  go.addEventListener("click", () => {
    started = true; hello.remove();
    radios.forEach(r => { r.disabled = false; });
    count.hidden = nav.hidden = false;
    show();
    radios[pick[k]].focus({preventScroll:true});
  });

  // One reply is [time, html, note, quality], or, for two chats, [[html, html], note, quality].
  function parts(i){
    const R = b.tasks[k].replies[i];
    return Array.isArray(R[0]) ? { time:null, chats:R[0], note:R[1], q:R[2] } : { time:R[0], chats:[R[1]], note:R[2], q:R[3] };
  }
  function asks(){
    const t = b.tasks[k], a = (t.asks || [t.ask]).slice();
    if(place && pick[k] !== b.ruleIn) a[0] = a[0] + " " + t.rule;
    return a;
  }
  function secs(time){ const m = /(\d+)\s*second/.exec(time || ""); return m ? +m[1] : 0; }
  function meta(time, i){
    const lvl = i + 1;
    return `<p class="simmeta">${time}<span class="simuse" aria-hidden="true">${[1,2,3].map(n => `<i class="${n <= lvl ? "on" : ""}"></i>`).join("")}</span><span>Usage: ${b.settings[i][1]}</span></p>`;
  }
  function pill(text){ const p = el("p","simsys in",text); return p; }
  function youEl(text, file){ return el("div","simyou",`<p>${text}</p>` + (file ? `<p class="simfile">📎 ${file}</p>` : "")); }
  function noteEl(P){ return el("p",`simnote ${P.q}`,`<b>What you got:</b> ${P.note}`); }
  function fill(reply, P, c){
    reply.className = "simreply";
    reply.innerHTML = (P.time ? meta(P.time, pick[k]) : "") + `<div class="simbody">${P.chats[c]}</div>`;
  }
  function setRule(){
    const on = place && pick[k] === b.ruleIn;
    rulebar.hidden = !on;
    if(on){ rulebar.innerHTML = `<b>${b.settings[b.ruleIn][0]}:</b> ${b.tasks[k].rule}`; rulebar.classList.remove("in"); void rulebar.offsetWidth; rulebar.classList.add("in"); }
  }
  function clearField(){ chip.textContent = ""; chip.hidden = true; typed.textContent = ""; ph.hidden = false; field.classList.remove("typing"); }
  // Type the reply into the body a few words at a time, the way an AI app streams its answer.
  async function stream(body, id){
    const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [];
    while(walk.nextNode()) if(walk.currentNode.nodeValue.trim()) nodes.push(walk.currentNode);
    const items = nodes.map(n => { const full = n.nodeValue; n.nodeValue = ""; const blk = n.parentElement.closest("tr,li,p"); if(blk) blk.style.visibility = "hidden"; return { n, full, blk }; });
    for(const p of items){
      if(p.blk) p.blk.style.visibility = "";
      for(const wd of p.full.split(/(\s+)/)){
        if(id !== run) return false;
        p.n.nodeValue += wd;
        if(wd.trim()) await wait(24);
      }
    }
    return true;
  }
  async function typeIt(text, file, id){
    clearField();
    await wait(350); if(id !== run) return false;
    ph.hidden = true; field.classList.add("typing");
    if(file){ chip.textContent = "📎 " + file; chip.hidden = false; await wait(450); if(id !== run) return false; }
    for(const ch of text){
      typed.textContent += ch;
      await wait(16); if(id !== run) return false;
    }
    await wait(300); if(id !== run) return false;
    send.classList.add("press"); await wait(220); send.classList.remove("press");
    if(id !== run) return false;
    clearField();
    return true;
  }
  async function think(reply, P, c, id){
    const n = secs(P.time), last = pick[k] === b.settings.length - 1 && !place;
    const dur = n ? Math.min(2600, 400 + n * 45) : 700;
    const word = last ? "Thinking" : "Answering";
    reply.className = "simreply thinking";
    reply.innerHTML = `<p class="simmeta"><span class="simdots" aria-hidden="true"><i></i><i></i><i></i></span><span class="simwait">${word}…</span></p>`;
    const clock = reply.querySelector(".simwait");
    const t0 = performance.now();
    while(!reduce){
      const f = Math.min(1, (performance.now() - t0) / dur);
      if(n) clock.textContent = `${word}… ${Math.round(n * f)}s`;
      if(f >= 1) break;
      await wait(90);
      if(id !== run) return false;
    }
    if(id !== run) return false;
    fill(reply, P, c);
    return stream(reply.querySelector(".simbody"), id);
  }
  // Play the task's chats. Animated the first time a task is shown, or after the learner moves a rule.
  async function play(animate){
    const id = ++run, t = b.tasks[k], P = parts(pick[k]), A = asks();
    thread.innerHTML = ""; clearField(); setRule();
    thread.setAttribute("aria-busy","true");
    for(let c = 0; c < A.length; c++){
      if(c > 0) thread.append(pill("New chat"));
      const file = c === 0 ? t.file : null;
      if(animate){ if(!(await typeIt(A[c], file, id))) return; }
      const you = youEl(A[c], file); if(animate) you.classList.add("in");
      thread.append(you);
      const reply = el("div","simreply"); thread.append(reply);
      if(animate){
        await wait(250); if(id !== run) return;
        if(!(await think(reply, P, c, id))) return;
        await wait(300); if(id !== run) return;
      } else fill(reply, P, c);
    }
    thread.append(noteEl(P));
    thread.removeAttribute("aria-busy");
    after();
  }
  // Lesson 1 style: keep the message, send it again with the new setting.
  async function resend(i){
    const id = ++run, P = parts(i);
    clearField();
    thread.querySelectorAll(".simreply,.simnote,.simsys").forEach(e => e.remove());
    thread.append(pill(`Sent again with ${b.settings[i][0]}`));
    const reply = el("div","simreply"); thread.append(reply);
    thread.setAttribute("aria-busy","true");
    if(!(await think(reply, P, 0, id))) return;
    thread.append(noteEl(P));
    thread.removeAttribute("aria-busy");
    after();
  }
  function show(){
    count.textContent = `${b.unit || "Task"} ${k + 1} of ${b.tasks.length}`;
    task.hidden = !place; if(place) task.innerHTML = `<b>The rule:</b> “${b.tasks[k].rule}”`;
    radios.forEach((r, i) => { r.checked = i === pick[k]; });
    best.hidden = true; hint.hidden = true; nudge(false);
    prev.disabled = k === 0; next.disabled = k === b.tasks.length - 1;
    const first = !seen.has(k); seen.add(k);
    play(first && !reduce);
  }
  function nudge(on){
    const left = b.settings.map((s, i) => i).filter(i => !tried[k].has(i));
    labs.forEach((l, i) => l.classList.toggle("nudge", on && left.includes(i)));
  }
  function after(){
    const t = b.tasks[k];
    const done = tried[k].size > 1;
    best.hidden = !done; hint.hidden = done; nudge(!done);
    if(!done){
      const left = b.settings.map((s, i) => i).filter(i => !tried[k].has(i));
      hint.innerHTML = `<b>Next:</b> select ${left.map(i => `<b>${b.settings[i][0]}</b>`).join(" or ")} at the top of the app to compare.`;
      thread.append(hint);
    }
    if(done){ best.innerHTML = `<b>${b.bestLabel || "Best setting for this task"}: ${b.settings[t.best][0]}.</b> ${t.why}`; thread.append(best); }
    state.done = tried.every(x => x.size > 1); ctx.update && ctx.update();
  }
  function choose(i){
    if(!started) return;
    pick[k] = i; tried[k].add(i);
    best.hidden = true; hint.hidden = true; nudge(false);
    if(place) play(!reduce); else resend(i);
  }
  return w;
}

function endBlock(b, n){
  const w = el("div","stack");
  w.append(el("p",null,b.html));
  const f = el("div","finish");
  const nextOpen = LESSONS[n+1] && !LESSONS[n+1].soon;
  const last = n === LESSONS.length - 1;
  const btn = el("button","btn", nextOpen ? `Finish and start Lesson ${n+2}` : last ? "Finish the course" : "Finish this lesson"); btn.type="button";
  btn.addEventListener("click",()=>{ setDone(n); location.hash = nextOpen ? "#lesson-"+(n+2) : "#home"; });
  const home = el("a","btn ghost","All lessons"); home.href="#home";
  f.append(btn);
  if(n > 0){ const prev = el("a","btn ghost",`Back to Lesson ${n}`); prev.href = "#lesson-"+n; f.append(prev); }
  f.append(home); w.append(f); return w;
}

/* ---------- routing ---------- */
function route(){
  const m = /^#lesson-(\d+)$/.exec(location.hash);
  const i = m ? +m[1]-1 : -1;
  if(i >= 0 && LESSONS[i] && !LESSONS[i].soon) renderLesson(i); else renderHome();
}
addEventListener("hashchange", route);
route();
</script>
