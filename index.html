};
const a = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;

const LESSONS = [
{
  title: "Start in the right place", min: 15,
  terms: "",
  builds: "Choose the app, the model, how long it thinks and where in the app to work. ",
  fits: "",
  intro: "Many weak replies start before you type anything, because you chose the wrong app or the wrong model for the task. This lesson shows you how to choose the app, the model, how long the model thinks and where in the app to work.",
  blocks: [
    {t:"h", text:"Part 1. Choose the right app for your task", why:""},
    {t:"p", html:`Copilot, ChatGPT, Claude and Gemini are each an <b>app</b>: the window you sign in to, type in and upload files to. All four can write, summarize and answer questions, so most tasks can start in any of them. They differ in three ways: what each app can read with no setup, what each one does well, and how each company handles your chats.`},
    {t:"frd", html:`Fredrickson has paid licenses for Copilot, ChatGPT and Claude. Fredrickson does not have a paid license for Gemini, so keep Fredrickson and client information out of Gemini. This course still covers Gemini, so you can talk with clients about it. Lesson 5 covers the rules for the three paid apps.`},
    {t:"appq", apps:[["Copilot","Microsoft",true],["ChatGPT","OpenAI",true],["Claude","Anthropic",true],["Gemini","Google",false]], tabs:[
      {title:"When should I use it?", cells:["Work already in Microsoft 365, such as a missed meeting or a long email thread","The most features in one app, such as images, voice and web search","Long documents, careful writing and tasks that use files on your computer","Work already in Google, such as a Google Doc a client shares"]},
      {title:"What is it connected to?", cells:["Word, Excel, PowerPoint, Outlook and Teams*","Nothing. It’s its own app and website.","Nothing. It’s its own app and website.","Gmail, Google Docs and Google Drive"]},
      {title:"How does it read files?", cells:["Your email, meetings and files*","Only files you upload, or Microsoft 365 if you link it","Only files you upload, or Microsoft 365 if you link it","Only files you upload, or Microsoft 365 if you link it"]},
      {title:"Does it train on my chats?", cells:["No, when you sign in with your Fredrickson account","Yes on personal plans, until you turn it off in Data controls","Only if you allow it in Privacy settings. Anthropic then keeps those chats up to five years.","Yes on personal accounts while Keep Activity is on, which is the default. People at Google read a sample of chats."]}]},
    {t:"p", html:`*Copilot reads your email, meetings and files only with a <b>paid Microsoft 365 Copilot license</b>. Without one, Copilot Chat reads the web and the files you add, like the other apps.`},
    {t:"pq", title:"Practice: choose the app", intro:"Choose the app that fits each task best. These questions do not count toward your score.", items:[
      {q:"You missed a Teams meeting with your project team. You want the decisions and your action items. You have a Copilot license.", choices:["Copilot","ChatGPT","Gemini"], correct:0,
        others:[null, "ChatGPT reads only the files you upload, unless you link Microsoft 365. You would find and upload the transcript first.", "Fredrickson has no paid license for Gemini, so keep Fredrickson information out of it. Your team’s meeting is Fredrickson information."],
        right:"Correct. With a Copilot license, Copilot already reads your Teams meetings, so you upload nothing.", wrong:"Not quite. With a Copilot license, Copilot already reads your Teams meetings, so you upload nothing."},
      {q:"You’re turning your rough draft in Word into an internal process document. You want the AI to edit the file you have open.", choices:["Copilot","Claude","ChatGPT"], correct:0,
        others:[null, "Claude is its own app, so you would copy the text out of Word and paste the edits back.", "ChatGPT is its own app, so you would copy the text out of Word and paste the edits back."],
        right:"Correct. Copilot is built into Word, so it edits the file you have open.", wrong:"Not quite. Copilot is built into Word, so it edits the file you have open."}]},
    {t:"gate"},
    {t:"h", text:"Part 2. Choose the model", why:""},
    {t:"p", html:`The app is the window you type in. The <b>model</b> is the AI behind the app that reads your request and answers it. One app can offer several models, and you can choose which one answers. For example, ChatGPT is the app, and GPT-6 and GPT-6 Pro are two of its models.`},
    {t:"p", html:`Most apps offer models in several sizes. A larger model often does better on hard work, such as a long document or many rules at once. A smaller model answers faster and uses less of your <b>usage limit</b>: the amount of AI use your plan allows before you must wait or switch to a smaller model.`},
    {t:"p", html:`Each company names its models differently, and the names change every few months. The menu usually says which model is the most capable and which is the fastest.`},
    {t:"table", head:["The task","What to choose"], rows:[
      ["A quick fix, such as the grammar in one sentence or a list turned into a table","A smaller model"],
      ["Everyday work, such as an email reply or a summary of one file","The everyday model, usually the app’s default"],
      ["A long document, a plan with many steps, or writing that must follow many rules at once","A larger model"]]},
    {t:"p", html:`Select an app to see the models in its menu, as of November 2026. Companies rename and replace models every few months, so check the menu in your app.`},
    {t:"tabs", tabs:[
      {title:"Copilot", html:`<p>Copilot has a model menu in Chat, Word, Excel, PowerPoint and Copilot Cowork. Cowork does whole tasks for you, and Part 4 covers it. Your admin decides which models appear, and the list can differ by license and region.</p>${qrows([
        ["Auto (the default)","Everyday questions, such as “What did I miss in this email thread?” Copilot chooses a model for each message.","You don’t see which model wrote the reply."],
        ["Claude Opus 5.5","Complex, high-stakes work, such as comparing two versions of a document or turning a long report into a plan with dates. Microsoft recommends it for this work.","Slower than Sonnet. Anthropic runs it outside Microsoft’s own data centers."],
        ["Claude Sonnet 5.5","Everyday work, such as drafting a reply to an email or turning meeting notes into a to-do list. It’s fast.","Less capable than Opus on the hardest work."],
        ["GPT-6.1 Sol","The same everyday work as Sonnet. It’s there when your admin turns off the Claude models.","Like every model you choose by name, it has a usage limit. At the limit, Copilot switches you to Auto."]])}<p>Copilot Cowork lists more models, such as GPT-6 Astra and Grok 4.7.</p>`},
      {title:"ChatGPT", html:`<p>On paid plans, the menu shows GPT-6 and GPT-6 Pro.</p>${qrows([
        ["GPT-6 (the default)","Most work, such as a reply to a client email or a summary of one file.","Less careful than GPT-6 Pro on work that must be right the first time."],
        ["GPT-6 Pro","Work that must be right the first time, such as checking a long spreadsheet for errors before it goes to a client.","Only on the Pro, Business and Enterprise plans. Enterprise admins can turn it off."],
        ["Older models, such as GPT-5.6","A prompt you already rely on, such as your weekly status report.","Less capable than GPT-6."]])}<p>Free and Go plans get a lighter, faster model called Luna.</p>`},
      {title:"Claude", html:`<p><b>Tip:</b> For most work, switch between Sonnet and Opus. Start with Sonnet, and switch to Opus when the task is long or hard. Save Fable for work that Opus does poorly.</p><p>Select the model name next to the send button. Older models are under <b>More models</b>.</p>${qrows([
        ["Claude Fable 5.2","The hardest, longest jobs, such as checking a 100-page proposal against every requirement in the request.","The slowest model, and it uses your usage limit the fastest."],
        ["Claude Opus 5.5","Long documents, plans and agent tasks, such as a one-page summary of a long report or a project plan with steps, owners and dates.","Slower than Sonnet."],
        ["Claude Sonnet 5.5","Everyday work, such as drafting an email, rewriting a paragraph in plainer words or summarizing a meeting. It’s fast.","Less capable than Opus and Fable on the hardest tasks."],
        ["Claude Haiku 5.5","Short, simple tasks, such as fixing the grammar in a sentence or turning a list into a table. It’s the fastest.","The smallest model. Choose a larger one for hard work."]])}`},
      {title:"Gemini", html:`<p><b>Fredrickson does not have a paid license for Gemini.</b> Keep Fredrickson and client information out of Gemini.</p><p>Which models you see depends on your Google plan. With <b>Auto</b> on, Gemini chooses the model for each prompt.</p>${qrows([
        ["Flash-Lite","A quick fact or a one-line rewrite. It’s fast, and it’s on every plan.","The least capable model in the menu. Gemini switches you to it when you reach your limit."],
        ["Gemini 4 Hydrogen","Everyday tasks, such as drafting a reply in Gmail or summarizing a Google Doc. It follows tone and format rules.","Brand new, and not built for long, deep reasoning."],
        ["Gemini Pro","A question with several steps, such as comparing three vendor quotes.","Older than the Gemini 4 models."],
        ["Gemini 4 Argon","Most work, such as a first draft of a report from several files in Drive. It’s Google’s top model for writing, analysis and coding.","Only on the AI Pro and AI Ultra plans."],
        ["Gemini 4 Carbon","The hardest reasoning and math, such as a budget forecast with several scenarios.","Only on AI Ultra. It uses more of your limit than Argon, and Google says Argon suits most work better."]])}`}]},
    {t:"p", html:`If you pasted the Claude model instructions in <a href="#setup">Before you start</a>, Claude tells you when a task needs Opus, and when Sonnet would do.`},
    {t:"sim", label:"Model", bestLabel:"Best model for this task", prompt:"Try each task in the practice app. Every reply is real: we sent each task to Claude’s Haiku, Sonnet and Opus, and the thinking setting stayed on Low for all three. Change the model, and the app answers again.",
      key:"In Claude, these are Haiku, Sonnet and Opus. In ChatGPT, GPT-6 is the everyday model and GPT-6 Pro is the larger one. In Copilot, choose Claude Sonnet for everyday work and Claude Opus for larger work.",
      settings:[["Smaller model","Low"],["Everyday model","Medium"],["Larger model","High"]], start:1,
      tasks:[
        {ask:"Fix the grammar: “Each of the managers have their own login, and they needs to reset it by Friday.”", best:0,
          replies:[
            ["Answered without thinking", `<p>Each of the managers has their own login, and they need to reset it by Friday.</p><p>The subject “each” is singular, so the verb becomes “has,” and “they” pairs with the plural verb “need.”</p>`, "Right, with a one-line reason. The smallest model used the least of your limit.", "good"],
            ["Answered without thinking", `<p>Corrected: “Each of the managers has their own login, and they need to reset it by Friday.”</p><p>Two fixes:</p><ul class="list"><li>“have” → “has”: “Each” is singular, so it takes a singular verb.</li><li>“needs” → “need”: “they” is plural, so the verb shouldn’t take an -s.</li></ul><p>If you’d like it to be consistently singular, you could also write: “Each of the managers has their own login, and each needs to reset it by Friday.” Or, to sidestep the issue entirely: “The managers each have their own logins and need to reset them by Friday.”</p>`, "Right. It also offers two other versions you didn’t ask for.", "ok"],
            ["Answered without thinking", `<p>“Each of the managers has their own login, and they need to reset it by Friday.”</p><p>Two fixes: “Each” is singular, so it takes “has,” and “they” takes “need,” not “needs.”</p>`, "Right, the same fix. The larger model used more of your limit for the same answer.", "ok"]],
          why:"Haiku, Sonnet and Opus all fixed the sentence without thinking. For a quick fix, the smallest model gives the same answer and uses the least of your limit."},
        {ask:"Write the catalog description for this course in our LMS. The description field holds exactly 150 characters, including spaces, and cuts off anything longer. Use as much of the 150 as you can. Give me only the description. Course: Giving Feedback That Lands. A 45-minute e-learning course for new managers. It covers the SBI model (situation, behavior, impact), how to give feedback in a one-on-one, and how to follow up. Learners practice with three scenarios.", best:1,
          replies:[
            ["Answered without thinking", `<p>Learn to give feedback that lands using the SBI model (situation, behavior, impact). Practice one-on-one delivery and follow-up across three realistic scenarios in 45 minutes.</p>`, "It reads well, but it’s 175 characters. The LMS cuts it off after “across three realistic.”", "poor"],
            ["Thought for 3 seconds", `<p>Learn the SBI model to give clear feedback in one-on-ones and follow up well. Practice with three scenarios in this 45-minute course for new managers.</p>`, "Exactly 150 characters, and it keeps every main point.", "good"],
            ["Thought for 4 seconds", `<p>New managers learn the SBI model to give clear feedback in one-on-ones and follow up well, then practice with three realistic scenarios. 45 minutes.</p>`, "148 characters, so it fits. The everyday model did the same job with less of your limit.", "ok"]],
          why:"Haiku answered without thinking and wrote 175 characters. Sonnet and Opus each thought for a few seconds, counted the characters and fit the limit. Part 3 shows a second fix on this same task: more thinking time for Haiku."}]},
    {t:"p", html:`For a short, simple task, the smallest model often gives the same answer as the largest. When a reply misses, try a larger model. Part 3 shows the other fix: more thinking time.`},
    {t:"vis", layout:"pair", label:"Two different settings", items:[
      ["model","Choose a model","Change which model answers the task. A larger model may handle harder work.","warm"],
      ["thinking","Choose thinking time","Keep the same model. Give it more or less time to work through the problem."]]},
    {t:"gate"},
    {t:"h", text:"Part 3. Choose how long the model thinks", why:""},
    {t:"p", html:`Many apps also let a model <b>think</b> before it answers. The model works through the problem step by step and checks its own work, then answers. Thinking time is a separate setting from the model, so you can give the same model more time or less.`},
    {t:"p", html:`<ul class="list"><li>The reply takes longer, from several seconds to a few minutes.</li><li>On hard tasks, the reply is right more often.</li><li>On easy tasks, the reply stays the same. The model often skips thinking.</li></ul>`},
    {t:"tabs", hint:"Select an app to see where to set thinking time.", tabs:[
      {title:"Copilot", html:`<p>In Chat, choose Auto, Quick response or Think deeper.</p><p>In Copilot Cowork, <b>reasoning effort</b> offers Light, Medium, High, Extra High or Max.</p>`},
      {title:"ChatGPT", html:`<p>On paid plans, the thinking levels are Instant, Medium, High and Extra High. Extra High is not on the Plus plan.</p><p>Free and Go plans have no thinking levels.</p>`},
      {title:"Claude", html:`<p>All four models think before they answer. <b>Effort</b> sets how long: Low, Medium, High, Extra or Max.</p><p>Claude recommends Medium.</p>`},
      {title:"Gemini", html:`<p><b>Thinking</b> offers Low, Medium or High. Low is the default.</p><p>With Auto on, Gemini chooses the thinking level for you.</p>`}]},
    {t:"table", head:["The task","What to choose"], rows:[
      ["A short email, a quick rewrite, or one simple step repeated many times","Less thinking"],
      ["A summary of one file or a first draft","The app’s default"],
      ["An exact length or count, exact math, or checking a draft against a contract","More thinking"]]},
    {t:"sim", prompt:"Try each task in the practice app. Every reply is real: we sent each task to Claude’s Haiku, the smallest model, on Low, Medium and High effort. The model stays the same. Change how long it thinks, and the app answers again.",
      key:"Less thinking is Quick response in Copilot, Instant in ChatGPT, and Low in Claude and Gemini. More thinking is Think deeper in Copilot, and High in the others.",
      settings:[["Less thinking","Low"],["Default","Medium"],["More thinking","High"]], start:1,
      tasks:[
        {ask:"Split this list into a First name column and a Last name column: Ana Ruiz, Ben Okafor, Chloe Park, Dev Patel, Mia Chen, Raj Singh, Sam Lee, Lena Torres", best:0,
          replies:[
            ["Answered without thinking", `<table><tr><th>First name</th><th>Last name</th></tr><tr><td>Ana</td><td>Ruiz</td></tr><tr><td>Ben</td><td>Okafor</td></tr><tr><td>Chloe</td><td>Park</td></tr><tr><td>Dev</td><td>Patel</td></tr><tr><td>Mia</td><td>Chen</td></tr><tr><td>Raj</td><td>Singh</td></tr><tr><td>Sam</td><td>Lee</td></tr><tr><td>Lena</td><td>Torres</td></tr></table>`, "The full table, right the first time.", "good"],
            ["Answered without thinking", `<table><tr><th>First name</th><th>Last name</th></tr><tr><td>Ana</td><td>Ruiz</td></tr><tr><td>Ben</td><td>Okafor</td></tr><tr><td>Chloe</td><td>Park</td></tr><tr><td>Dev</td><td>Patel</td></tr><tr><td>Mia</td><td>Chen</td></tr><tr><td>Raj</td><td>Singh</td></tr><tr><td>Sam</td><td>Lee</td></tr><tr><td>Lena</td><td>Torres</td></tr></table>`, "The same table. The model chose not to think, because the task is simple.", "ok"],
            ["Answered without thinking", `<table><tr><th>First name</th><th>Last name</th></tr><tr><td>Ana</td><td>Ruiz</td></tr><tr><td>Ben</td><td>Okafor</td></tr><tr><td>Chloe</td><td>Park</td></tr><tr><td>Dev</td><td>Patel</td></tr><tr><td>Mia</td><td>Chen</td></tr><tr><td>Raj</td><td>Singh</td></tr><tr><td>Sam</td><td>Lee</td></tr><tr><td>Lena</td><td>Torres</td></tr></table>`, "The same table again. Even on the highest setting, the model skipped thinking.", "ok"]],
          why:"Haiku gave the same table on every setting and never thought, even on High. The AI repeats one simple step for each name, so more thinking time adds nothing."},
        {ask:"Write the catalog description for this course in our LMS. The description field holds exactly 150 characters, including spaces, and cuts off anything longer. Use as much of the 150 as you can. Give me only the description. Course: Giving Feedback That Lands. A 45-minute e-learning course for new managers. It covers the SBI model (situation, behavior, impact), how to give feedback in a one-on-one, and how to follow up. Learners practice with three scenarios.", best:1,
          replies:[
            ["Answered without thinking", `<p>Learn to give feedback that lands using the SBI model (situation, behavior, impact). Practice one-on-one delivery and follow-up across three realistic scenarios in 45 minutes.</p>`, "It reads well, but it’s 175 characters. The LMS cuts it off after “across three realistic.”", "poor"],
            ["Thought for 7 seconds", `<p>Learn the SBI model for giving feedback that lands. Practice in a one-on-one, work through three scenarios, and plan your follow-up. For new managers.</p>`, "Exactly 150 characters. The model counted, then trimmed until the description fit.", "good"],
            ["Thought for 7 seconds", `<p>Give feedback that lands. In 45 minutes, learn the SBI model, how to deliver feedback in a one-on-one, and how to follow up. Practice three scenarios.</p>`, "Also exactly 150 characters. More thinking gave the same result as the default here.", "ok"]],
          why:"On Low, Haiku answered without thinking and ran over the limit. On Medium and High, Haiku thought for 7 seconds, counted and trimmed, and hit 150 exactly. Fitting an exact limit means counting, and thinking time gives the model time to count. In Part 2, a larger model fixed the same task."}]},
    {t:"p", html:`Judge a task by how many things the AI has to weigh at once, not by how long it is.`},
    {t:"p", html:`<b>Change the model or add thinking?</b> When a reply misses, look at what went wrong.`},
    {t:"table", head:["What went wrong","What to change"], rows:[
      ["The reply has the wrong tone, skips one of several rules or loses detail from a long document","Choose a larger model"],
      ["The reply gets a count, math or a step-by-step check wrong","Add thinking time"],
      ["The reply is right, but slow, or you keep reaching your usage limit","Choose a smaller model or less thinking"]]},
    {t:"pq", title:"Practice: change the model or the thinking", intro:"Each reply below missed in a different way. Choose what to change first. These questions do not count toward your score.", items:[
      {q:"You ask Sonnet to make a client email sound warmer. The reply keeps your facts, but the tone still sounds stiff.", choices:["Choose a larger model","Add thinking time","Choose a smaller model or less thinking"], correct:0,
        others:[null, "Thinking time helps with counts, math and step-by-step checks. Tone is none of those, so try a larger model first.", "The reply already missed, so a smaller model would likely miss by more."],
        right:"Correct. Tone is not a count or a math problem, so thinking time helps little. A larger model is the better first try.", wrong:"Not quite. Tone is not a count or a math problem, so try a larger model first."},
      {q:"You ask the AI to total the hours in a 40-row timesheet table. The total is six hours off.", choices:["Choose a larger model","Add thinking time","Choose a smaller model or less thinking"], correct:1,
        others:["The reply got the math wrong, and math needs step-by-step work. Thinking time gives the same model time to add and check.", null, "The reply is wrong, not slow. Less thinking makes a math mistake more likely."],
        right:"Correct. Math needs step-by-step work, and thinking time gives the model time to add and check.", wrong:"Not quite. Math needs step-by-step work, so add thinking time."},
      {q:"All day, you use Opus on High to fix typos in short Teams posts. The replies are right, but each one is slow, and you reach your usage limit by noon.", choices:["Choose a larger model","Add thinking time","Choose a smaller model or less thinking"], correct:2,
        others:["The replies are already right. A larger model would be slower and use your limit faster.", "The replies are already right. More thinking would be slower and use your limit faster.", null],
        right:"Correct. The replies are right, so a smaller model or less thinking gives the same fixes faster and saves your limit.", wrong:"Not quite. The replies are right, so choose a smaller model or less thinking."},
      {q:"You ask the AI to pull themes from 12 interview transcripts. The themes are right, but the report skips two of your five rules and leaves out quotes from the last transcripts.", choices:["Choose a larger model","Add thinking time","Choose a smaller model or less thinking"], correct:0,
        others:[null, "Thinking time helps with counts, math and step-by-step checks. A larger model often does better with many rules and long documents.", "The reply already missed, so a smaller model would likely miss by more."],
        right:"Correct. The reply skipped rules and lost detail from long documents, so choose a larger model.", wrong:"Not quite. The reply skipped rules and lost detail from long documents, so choose a larger model."}]},
    {t:"statement", text:"A larger model often handles harder work better, such as many rules at once or a long document. More thinking gives the same model time to work a problem through, step by step."},
    {t:"p", html:`<b>Let the AI help you choose.</b> Use any of these four ways to choose the model and the thinking setting. The first three work in every app.`},
    {t:"table", head:["Way","What to do"], rows:[
      ["Ask about the task","Ask: “Before you answer, tell me whether this task needs careful step-by-step reasoning or a quick answer.” Ask about the task, not about model names. A model knows little about models released after it was trained."],
      ["Save an instruction","Add a saved instruction: “If a task needs more thinking time than this setting gives, say so before you answer.”"],
      ["Test once","For a task you repeat, send the same prompt with two settings. Compare the replies, and keep the better setting for that task."],
      ["Use Auto","In Copilot and Gemini, leave the setting on Auto. The app then chooses the setting for each message."]]},
    {t:"gate"},
    {t:"h", text:"Part 4. Choose chat, a project or an agent", why:""},
    {t:"p", html:`You have the app, the model and the thinking setting. Last, choose where in the app to work. A chat, a project and an agent each take on a different share of the work. Each app offers more than one place to work.<ul class="list"><li>In a <b>chat</b>, you type a request, the AI replies, and you do the rest. </li><li>A <b>project</b> is a workspace that keeps the same files and instructions ready for every chat inside it. Claude and ChatGPT call it a project. In Copilot, look for Projects, Notebooks or Workspaces.</li><li>An <b>agent</b> does the steps of a task itself, such as opening files, searching the web and building a document. Some agents also have projects. For example, a project in Claude Cowork keeps the same files and instructions ready for every Cowork task inside it. Lesson 3 covers agents in full: how they work, and how to brief them, keep them safe and check their work.</li></ul>`},
    {t:"p", html:`Choose the simplest option that can do the task. Check the options in this order: chat, then a project, then an agent.`},
    {t:"flow"},
    {t:"p", html:`Answer the questions from the top. The first question checks whether chat or a project can do the task. You need an agent only when the answer is yes.`},
    {t:"practice"},
    {t:"frd", kind:"job", html:`${a(L.tool,"Choose the Right AI Tool for a Task")} has a table for Claude, ChatGPT and Copilot, and a checklist to follow before you start an agent.`},
    {t:"gate"},
    {t:"h", text:"Knowledge Check: apply what you learned"},
    {t:"p", html:`Answer all four. Your score appears after the last question.`},
    {t:"kc", check:true, others:["Copilot reads your meetings only with a Copilot license. Your work sign-in alone is not enough.", null, "The model answers you, but the app decides what the AI can read. A different model cannot see the meeting either.", "Your Teams meeting is not on the web, so a web search cannot find it."], q:"You open Copilot Chat, with no Copilot license, and ask it to summarize yesterday’s Teams meeting. What happens?",
      choices:["It reads the meeting through your work sign-in.", "It cannot read the meeting until you add the transcript.", "It reads the meeting if you choose a more capable model.", "It finds the meeting with a web search."], correct:1,
      right:"Correct. Without the license, Copilot Chat reads only the web and the files you add.", wrong:"Not quite. Copilot reads your meetings only with a Copilot license. Without one, add the transcript."},
    {t:"kc", check:true, others:["A short answer can still need long work. The model has to compare three years of data and find a cause.", "The default suits a summary of one file. Finding a cause in three years of data is harder work.", "Reading the numbers is easy. Working out a cause across three years is hard, so the model needs more thinking, not less.", null], q:"You need to explain a drop in enrollment from three years of spreadsheet data. Which setting do you choose?",
      choices:["Less thinking, because the answer is one paragraph", "The app’s default, because the data is in one file", "A smaller model, because the AI only has to read numbers", "More thinking, because the model has to work through long data"], correct:3,
      right:"Correct. Long data and a cause to work out are where thinking time helps.", wrong:"Not quite. The answer may be short, but the work is not. Long data and a cause to work out need more thinking time."},
    {t:"kc", check:true, others:[null, "A longer prompt cannot add facts the model never learned.", "More thinking helps the model reason. It does not teach the model about models released after it was trained.", "Apps do not prefer their oldest model. The model learned nothing about newer models after it was trained."], q:"You ask a model which model you should use, and it recommends one that has since been replaced. Why?",
      choices:["A model knows little about models released after it was trained.", "Your prompt was too short.", "The model was set to less thinking.", "The app always recommends its oldest model."], correct:0,
      right:"Correct. Ask the model about the task instead: does it need careful reasoning or a quick answer?", wrong:"Not quite. A model knows little about models released after it was trained. Ask it about the task instead."},
    {t:"kc", check:true, others:["You would paste in 200 notes, then move each file yourself.", "More thinking helps the AI decide where each note goes, but in a chat you still move every file yourself.", "A project keeps files ready for your chats. It does not open or move files.", null], q:"You need 200 notes in one folder sorted into subfolders by client. What do you choose?",
      choices:["Chat, because you can paste the notes in.", "Chat with more thinking, because 200 notes take careful sorting.", "A project, because all the notes are in one folder.", "An agent, because the AI has to open and move many files itself."], correct:3,
      right:"Correct. An agent such as Claude Cowork can open and move the files.", wrong:"Not quite. The AI has to open and move 200 files, so you need an agent."},
    {t:"score", pass:3},
    {t:"cards", cards:[
      ["App","The window you sign in to, type in and upload files to, such as Copilot or Claude."],
      ["Model","The AI behind an app that reads your request and answers it. One app can offer several models."],
      ["Usage limit","The amount of AI use your plan allows before you must wait or switch to a smaller model."],
      ["Thinking","A setting in which the model works through a problem step by step before it replies. Slower, and right more often on hard tasks."],
      ["Chat","A conversation in which you type a request, the AI replies, and you do the rest."],
      ["Project","A workspace that keeps the same files and instructions ready for every chat inside it."]]},
    {t:"end", html:`You can now choose an app for a task and say why, choose a model and how long it thinks, and choose chat, a project or an agent. Post a question or something you tried in the ${a(L.teams,"Learning and practicing with AI tools")} channel in Teams. Lesson 2 shows how to give the AI what it needs.`}
  ]
},
{
  title: "Give the AI what it needs", min: 16,
  terms: "",
  builds: "Choose where to put directions and files. Find out why the AI seems to forget, and set it up to follow your directions.",
  fits: "",
  intro: "Most weak replies come from what the AI was given, not from the model. Learn where to put your directions and files so the AI uses them every time.",
  blocks: [
    {t:"h", text:"Part 1. Put directions in a prompt or in custom instructions", why:""},
    {t:"p", html:`A <b>prompt</b> is everything you send in one message: your request, your instructions, any examples and any attached files. A rule in a prompt applies to that message only.`},
    {t:"p", html:`<b>Custom instructions</b> are saved directions the AI follows in every chat you start, such as your role, your tone or the format you prefer. You write them once in the app’s settings, and the app adds them to every chat for you.`},
    {t:"statement", text:"A prompt applies to one message. Custom instructions apply to every chat."},
    {t:"tabs", tabs:[
      {title:"Prompt", html:`<p>Applies to one message.</p><ul class="list"><li>“Summarize this email in three bullets,” with the email pasted below.</li><li>“This summary is for the client’s CFO, so lead with cost.”</li></ul>`},
      {title:"Custom instructions", html:`<p>Apply to every chat you start.</p><ul class="list"><li>“I am an instructional designer. My audience is usually HR leaders.”</li><li>“Check today’s date before you answer.”</li></ul>`}]},
    {t:"note", html:`<b>Easy to mix up.</b> Ask: do I want this in every chat, or only now? Every chat: custom instructions. Only now: the prompt. A rule for only one client goes in a project, which Part 2 covers.`},
    {t:"p", html:`A good prompt holds four parts: the <b>goal</b>, the <b>reader</b>, the <b>format</b> and an <b>example</b> when you have one. Your custom instructions already say who you are, so the prompt holds what changes with each task.`},
    {t:"tabs", tabs:[
      {title:"Prompt missing parts", html:`<p>“Help me plan the workshop.”</p><p>The AI has to guess the goal, the audience, the length and what you want back, so the reply is generic.</p>`},
      {title:"Prompt with all four parts", html:`<p>“Plan a 90-minute workshop on giving feedback. <b>Goal:</b> new managers leave able to give one piece of feedback this week. <b>Reader:</b> the HR lead who approves the agenda. <b>Format:</b> a table with the time, the activity and the materials. <b>Example:</b> the attached agenda from last year’s workshop.”</p>`}]},
    {t:"sim", prompt:"Find the right place for each rule.", unit:"Rule", label:"Put the rule in",
      steps:["Select Start. The app runs two chats, with the rule typed into your first prompt.","Select Custom instructions at the top of the app. The app runs the same two chats with the rule saved instead.","Compare the replies in the new chat, then go to the next rule."], settings:[["Prompt"],["Custom instructions"]], start:0, ruleIn:1,
      bestLabel:"Best place for this rule",
      tasks:[
        {rule:"Use plain language, with no jargon.", asks:["Draft a welcome note for new learners.","Write a reminder about Friday’s workshop."], best:1,
          replies:[
            [[`<p>Welcome! Over the next four weeks, you’ll learn how to give feedback your team can act on. Each week takes about an hour.</p>`, `<p>Reminder: Friday’s workshop will leverage best-practice frameworks to drive alignment on feedback culture and optimize team performance outcomes.</p>`], "The welcome note is plain. The rule was only in the first chat’s prompt, so the reminder is full of jargon.", "poor"],
            [[`<p>Welcome! Over the next four weeks, you’ll learn how to give feedback your team can act on. Each week takes about an hour.</p>`, `<p>Reminder: Friday’s workshop is about giving feedback. Bring one conversation you’ve been putting off, and we’ll practice it together.</p>`], "Both drafts are plain, and you wrote the rule once.", "good"]],
          why:"You want plain language in every chat, so the rule goes in custom instructions."},
        {rule:"The reader is the client’s CFO, so lead with cost.", asks:["Summarize this proposal for the client.","Write a thank-you note to Dana, who led yesterday’s session."], file:"Client proposal.pdf", best:0,
          replies:[
            [[`<ul class="list"><li>Cost: $48,000, paid in two parts.</li><li>Return: managers trained in 12 weeks instead of 6 months.</li><li>Scope: 40 managers across three sites.</li></ul>`, `<p>Dana, thank you for yesterday. The group was engaged the whole time, and three people asked when you’re coming back.</p>`], "The summary leads with cost, and the thank-you note sounds like a thank-you note.", "good"],
            [[`<ul class="list"><li>Cost: $48,000, paid in two parts.</li><li>Return: managers trained in 12 weeks instead of 6 months.</li><li>Scope: 40 managers across three sites.</li></ul>`, `<p>Dana, thank you for yesterday. At $3,200, the session came in under budget, at $160 per participant.</p>`], "The thank-you note leads with cost too. Custom instructions applied the rule to a chat that didn’t need it.", "poor"]],
          why:"The reader changes with each task, so the rule goes in the prompt."},
        {rule:"Check today’s date before you answer.", asks:["How many weeks until our March 3 launch?","Draft an invite to next Friday’s planning meeting."], best:1,
          replies:[
            [[`<p>I checked today’s date. The March 3 launch is about 16 weeks away.</p>`, `<p>Please join us for planning next Friday, [date], at 10 a.m. in the main conference room.</p>`], "The first reply counts from today. The new chat didn’t check the date, so it left a blank.", "poor"],
            [[`<p>I checked today’s date. The March 3 launch is about 16 weeks away.</p>`, `<p>Please join us for planning next Friday, the 20th, at 10 a.m. in the main conference room.</p>`], "Both chats checked the date, so the invite is ready to send.", "good"]],
          why:"You want every chat to know the date, so the rule goes in custom instructions."},
        {rule:"Make the case against my proposal.", asks:["Here’s my proposal for a mentoring program.","Write a note congratulating Priya on her promotion."], file:"Mentoring proposal.docx", best:0,
          replies:[
            [[`<ul class="list"><li>Mentors give up two hours a month, and the proposal doesn’t say what they stop doing.</li><li>There’s no way to measure success after the first year.</li><li>Pairing by department limits what new hires learn.</li></ul>`, `<p>Congratulations, Priya! The promotion is well earned, and your team is lucky to have you.</p>`], "You got the case against your proposal, and the congratulations stayed warm.", "good"],
            [[`<ul class="list"><li>Mentors give up two hours a month, and the proposal doesn’t say what they stop doing.</li><li>There’s no way to measure success after the first year.</li><li>Pairing by department limits what new hires learn.</li></ul>`, `<p>Congratulations, Priya. Before you celebrate, here are three risks in your new role: a larger team, less time for your own work and higher expectations.</p>`], "The note to Priya became a list of risks.", "poor"]],
          why:"You want criticism of this proposal only, so the rule goes in the prompt."}]},
    {t:"frd", kind:"job", html:`${a(L.directions,"Get AI to Follow Your Directions")} shows how to set up custom instructions in Claude, ChatGPT and Copilot.`},
    {t:"gate"},
    {t:"h", text:"Part 2. Put files where the AI can read them", why:""},
    {t:"p", html:`The AI reads only what you give it and what the app can open. You have four ways to give it files: upload them to a chat, save them in a project, link another app, or point an agent at a folder on your computer.`},
    {t:"p", html:`A <b>connector</b> is a link that lets an AI tool read or change data in another app, such as Outlook, SharePoint or Notion.`},
    {t:"filemap", label:"Four ways to provide a file", groups:[
      {kind:"copy", title:"Working from a copy", sub:"Later edits to the original won’t update this copy.", items:[
        ["upload","Upload to a chat","A copy is available to <b>that conversation only</b>. Upload the new file if it changes."],
        ["project","Save in a project","Every chat <b>in that project</b> can use the saved copy. Replace it when it changes."]]},
      {kind:"live", title:"Accessing the current file", sub:"AI can read updated versions when it accesses them.", items:[
        ["connector","Use a connector","Read a file <b>in another app</b>, such as Outlook or SharePoint. Access depends on the connector."],
        ["folder","Point an agent to a folder","The agent works with <b>original files</b> and may change them."]]}]},
    {t:"compare", cols:["Upload to a chat","Project","Connector","Folder on your computer"], rows:[
      ["Where the file is","A copy in one chat","A copy saved in the project","In another app, such as Outlook, SharePoint or Notion","In a folder you choose"],
      ["Who can read the file","That chat only","Every chat in the project","Any chat where you turn the connector on","An agent you point at the folder, such as Claude Cowork or Claude Code"],
      ["If you edit the file later","The AI still reads the old copy. Upload the new one.","The AI still reads the old copy. Replace it in the project.","+The AI reads your new version.","+The agent reads your new version."],
      ["Can the AI change your original file","No. It works on a copy.","No. It works on a copy.","Only if the connector allows it","Yes. The agent saves its changes to the files in the folder."],
      ["Use it when","You need the file once.","You repeat a task with the same files.","The file is kept in another app and changes often.","The task uses many files, or the AI should change them."]]},
    {t:"p", html:`Each app has its own name for a project. Claude and ChatGPT call it a project. In Copilot, look for Projects for your own work or Workspaces for a team. You may still see the older name, Notebooks. Gemini has no projects yet.`},
    {t:"p", html:`The AI can read or change anything a connector allows. Many connectors are built on <b>MCP (Model Context Protocol)</b>, a shared standard for building connectors, so one connector can work in Claude, ChatGPT and Copilot. You may see the letters MCP when you add a connector. In ChatGPT, connectors are called “apps.” In Copilot, an admin sets up connectors for the whole organization.`},
    {t:"p", html:`A project has instructions too. If the instructions apply only to chats about one client or one task, put them in the project, not in your custom instructions.`},
    {t:"statement", text:"Custom instructions apply to every chat. A project’s files and instructions apply only to chats inside it. A connector lets the AI read another app."},
    {t:"sort", goal:"Before you start a task, you decide where each file goes. Practice that choice with five files.", prompt:"Drag each item to where it belongs, or select a pile.", piles:["Upload to a chat","Project","Connector"],
      cards:[["A 12-page PDF you need summarized once",0,"You need it once."],
        ["A client’s brand guide, for every chat about that client",1,"Every chat about that client needs the same file."],
        ["Your Outlook calendar, which changes every day",2,"It is kept in another app and changes every day."],
        ["Instructions for the weekly newsletter, used only in newsletter chats",1,"Only newsletter chats need them."],
        ["Your team’s project folder in Fredrickson’s SharePoint, updated every week",2,"The files change each week, so the connector reads the current version."]]},
    {t:"acc", title:"See where each card goes and why", html:`<ul class="list">
      <li>The 12-page PDF: upload it to a chat. You need it once.</li>
      <li>The brand guide: project. Every chat about that client needs the same file.</li>
      <li>The Outlook calendar: connector. It is kept in another app and changes every day.</li>
      <li>The newsletter instructions: project. Only newsletter chats need them.</li>
      <li>The SharePoint folder: connector. The files change each week, so the connector reads the current version.</li></ul>`},
    {t:"frd", kind:"job", html:`${a(L.directions,"Get AI to Follow Your Directions")} shows how to set up projects in Claude, ChatGPT and Copilot.`},
    {t:"gate"},
    {t:"h", text:"Part 3. Find out why the AI seems to forget", why:""},
    {t:"p", html:`Two of the causes depend on the <b>context window</b>: the most text a model can read at one time, including the whole chat, any files and the model’s own replies. Each message adds to it. Each new chat starts with an empty context window.`},
    {t:"p", html:`AI apps measure the text in a context window in <b>tokens</b>. One token is about three-quarters of an English word. Context windows and usage limits both count tokens.`},
    {t:"vis", layout:"pair", label:"What the AI can read now", items:[
      ["longchat","A long chat","The AI may no longer read details from early in the chat."],
      ["newchat","A new chat","Starts with an empty context window. Your earlier chat is not in that window.","warm"]]},
    {t:"process", label:"Cause", intro:"Select Start to see each cause, what it looks like in the chat and its fix.", steps:[
      ["The chat got longer than the context window","The app dropped or shortened early messages, so answers get worse.", qrows([["What you see","The AI misses a rule or a file from the start of a long chat."],["The fix",`Start a new chat. Paste in a <b>handoff note</b>: a short summary of the work so far. ${a(L.limits,"Make Your AI Usage Limits Last Longer")} shows how.`]], true)],
      ["The rule is in the middle of a long chat","Even when the whole chat fits in the context window, models follow the start and the end of a chat more closely than the middle.", qrows([["What you see","The AI follows some of your earlier rules and skips others."],["The fix","Repeat the rule at the end of your prompt."]], true)],
      ["A newer message disagrees with an older rule","The AI usually follows what it read most recently.", qrows([["What you see","You asked for 100 words, then pasted a long example. The reply is as long as the example."],["The fix","Repeat the rule in the same prompt as the example."]], true)],
      ["Memory did not save it",`<b>Memory</b> is a feature that saves a few facts about you between chats. The app chooses what to save, and it saves a short note, not the whole chat.`, qrows([["What you see","The AI uses some facts from past chats, but not the one you need."],["The fix",`Check what memory saved in the app’s settings. ${a(L.directions,"Get AI to Follow Your Directions")} shows where. Put rules you need every time in custom instructions, not memory.`]], true)],
      ["It is a new chat","Each chat starts empty. The AI does not read your other chats, except for what memory saved.", qrows([["What you see","The AI does not know what you told it yesterday."],["The fix","Put rules you use often in custom instructions or a project."]], true)],
      ["It never read the whole file","The file was too long, a scanned image, or a type the app cannot open.", qrows([["What you see","The AI knows nothing about part of a file you attached."],["The fix","Ask which pages it could read, and ask for the page of each point."]], true)],
      ["Two sets of instructions disagree","Your custom instructions, a project’s instructions and your prompt say different things, so the AI follows one of them.", qrows([["What you see","The AI follows one rule and ignores a rule you wrote somewhere else."],["The fix","Delete the rule from the place where it does not belong."]], true)]]},
    {t:"statement", text:"When the AI seems to forget, ask where the information was: early in this chat, in another chat, in a file, or in another set of instructions. The fix depends on where it was."},
    {t:"sort", goal:"At work, you see what went wrong, not why. Practice choosing the first fix to try for six problems.", prompt:"Drag each problem to the fix that works, or select a pile.", piles:["Start a new chat","Repeat the rule in your prompt","Change your saved instructions","Ask what it could read"],
      cards:[["After three hours in one chat, Claude no longer uses the client name you gave it at the start.",0,"The chat got longer than the context window. Paste a handoff note with the client name into the new chat."],
        ["You ask for a bulleted list and paste a long paragraph to edit, all in one message. The AI replies with a paragraph.",1,"The AI followed the paragraph, because it read the paragraph last. Put “Reply in bullets” after the paragraph."],
        ["Every Monday you start a new chat and type the same five rules for the newsletter.",2,"A new chat starts empty, so save the rules in a newsletter project."],
        ["ChatGPT summarizes a 90-page report and says nothing about the last chapter.",3,"Ask which pages it could read. If it missed the last chapter, give it that chapter on its own."],
        ["Your custom instructions say “Be brief.” Your client project says “Explain each step in detail.” Replies in the project are sometimes short and sometimes long.",2,"The two sets of instructions disagree. Delete “Be brief” from custom instructions, or add “except in this project” to it."],
        ["In a long chat that still fits in the context window, Copilot skips one rule you gave halfway through.",1,"The chat fits, but the model follows the middle of a chat less closely than the end."]]},
    {t:"acc", title:"See where each card goes and why", html:`<ul class="list">
      <li>The client name after three hours: start a new chat. The chat got longer than the context window. Paste a handoff note with the client name into the new chat.</li>
      <li>The paragraph instead of bullets: repeat the rule in your prompt. The AI followed the paragraph, because it read the paragraph last. Put “Reply in bullets” after the paragraph.</li>
      <li>The five newsletter rules: change your saved instructions. A new chat starts empty, so save the rules in a newsletter project.</li>
      <li>The missing last chapter: ask what it could read. Ask which pages it could read. If it missed the last chapter, give it that chapter on its own.</li>
      <li>Short and long replies: change your saved instructions. The two sets of instructions disagree. Delete “Be brief” from custom instructions, or add “except in this project” to it.</li>
      <li>The skipped rule from halfway through: repeat the rule in your prompt. The chat fits, but the model follows the middle of a chat less closely than the end.</li></ul>`},
    {t:"gate"},
    {t:"h", text:"Part 4. Fix a wrong reply", why:""},
    {t:"p", html:`When a reply fails, check the causes in this order. First, the prompt: most weak replies come from a prompt that leaves out the goal, the reader or the format. Second, what the app can read. Third, the <b>knowledge cutoff</b>: the date the model’s learning stops. The model knows nothing that happened after that date, in any chat. Change the model last, after the prompt and the files are right.`},
    {t:"note", html:`<b>Prompt or model?</b> Imagine giving the same prompt and files to a capable new hire. If the new hire would need to ask questions or guess, the prompt is missing something, so rewrite the prompt. If the new hire would get it right and the AI does not, choose a more capable model or more thinking time.`},
    {t:"p", html:`Some apps search the web when a question needs current facts. The app runs the search and lists the sources, and the model still writes the summary. Check the summary against the sources.`},
    {t:"p", html:`A model learned patterns from a very large amount of text, and it writes the words most likely to come next. Nothing in that step checks whether a fact is true. So AI is wrong most often in the same six kinds of answers, and a wrong reply reads just as sure as a right one. You can guard against most of them once, with custom instructions, a project or a connector.`},
    {t:"accs", hint:"Select each kind of answer to see how to guard against it.", items:[
      ["Sources and quotes", `<p>It cites a study, article or quote that does not exist. This is a <b>hallucination</b>: a false statement given as fact that was never true.</p>${qrows([["Set up once","Turn on web search. Add a custom instruction: link a source for every fact, and say when no source was found."],["Still up to you","Open the sources behind the facts a client will rely on."]], true)}`],
      ["Recent events and today’s date", `<p>It gives a fact that was true before its knowledge cutoff.</p>${qrows([["Set up once",`Add a custom instruction: check today’s date, and search for anything that may have changed. ${a(L.date,"Get AI to Use Today’s Date")} shows how.`],["Still up to you","Little. Glance at the dates in the reply when timing matters."]], true)}`],
      ["Exact numbers", `<p>It counts words, adds a column or works out a percent by writing likely digits.</p>${qrows([["Set up once","Turn on the app’s code or data analysis feature, so the app calculates. Add a custom instruction: calculate, do not estimate."],["Still up to you","Check totals that go to a client in Excel."]], true)}`],
      ["Small or private facts", `<p>It learned little or nothing about a client’s staff, a small company or Fredrickson’s own process, so it writes something likely instead.</p>${qrows([["Set up once","Link OneDrive, SharePoint or Notion with a connector, or keep the client’s files in a project."],["Still up to you","Add the source for anything outside those files."]], true)}`],
      ["Long files and files it cannot read", `<p>In a long file, it can skip sections. If you paste part of a file, it can reply as if it read all of it.</p>${qrows([["Set up once","Add a custom instruction: give the page or section for each point, and say what you could not read."],["Still up to you","Compare a few points with the file."]], true)}`],
      ["Questions that suggest an answer", `<p>Ask “Isn’t this the best option?” and the reply usually says yes.</p>${qrows([["Set up once","Add a custom instruction: name weaknesses, and disagree when the evidence does."],["Still up to you","Ask a neutral question. No setting can rewrite your question for you."]], true)}`]]},
    {t:"note", html:`<b>Easy to mix up.</b> A hallucination and an out-of-date answer need different guards. Ask: was this ever true? If never, the guard is a source for every fact. If it was true before the cutoff, the guard is the date and a web search.`},
    {t:"p", html:`The custom instructions, web search and code settings from <a href="#setup">Before you start</a> set up most of these guards. The “Still up to you” row in each kind is what no setting does for you.`},
    {t:"sort", goal:"Practice finding the cause of a wrong reply, so you change the right thing first.", prompt:"Drag each problem to the change that fixes it, or select a pile.", piles:["Rewrite the prompt","Add or link the file","Turn on web search","Choose a different model"],
      cards:[["You ask, “Help me plan the workshop,” and the reply is generic.",0,"Add the goal, the audience, the length and what you want back."],
        ["Claude cannot see a client email in your Outlook inbox.",1,"Copilot reads Outlook, or you can link Microsoft 365 to Claude. A different model cannot read the email either."],
        ["You need a press release the client posted on its public website this week.",2,"The page is newer than the model’s knowledge cutoff, and it is public, so a search can find it. A search cannot find news that is not public."],
        ["The draft uses the wrong tone, and your prompt never said who will read it.",0,"Say who the reader is."],
        ["ChatGPT cannot open a job aid page in Notion.",1,"Paste the page in, or link Notion to ChatGPT."],
        ["Your prompt gives the goal, the reader, the format and an example. The app has every file it needs. The plan still skips steps.",3,"The prompt and the files are right, so a more capable model or more thinking time is the next change."]]},
    {t:"acc", title:"See where each card goes and why", html:`<ul class="list">
      <li>The generic workshop plan: rewrite the prompt. Add the goal, the audience, the length and what you want back.</li>
      <li>The Outlook email: add or link the file. Copilot reads Outlook, or you can link Microsoft 365 to Claude. A different model cannot read the email either.</li>
      <li>The public press release: turn on web search. The page is newer than the model’s knowledge cutoff, and it is public, so a search can find it. A search cannot find news that is not public.</li>
      <li>The wrong tone: rewrite the prompt. Say who the reader is.</li>
      <li>The Notion page: add or link the file. Paste the page in, or link Notion to ChatGPT.</li>
      <li>The plan that still skips steps: choose a different model. The prompt and the files are right, so a more capable model or more thinking time is the next change.</li></ul>`},
    {t:"statement", text:"Set up once what you can. Then check the facts a client will rely on."},
    {t:"gate"},
    {t:"h", text:"Knowledge Check: apply what you learned"},
    {t:"p", html:`Answer all six. Your score appears after the last question.`},
    {t:"kc", check:true, others:["A different model cannot read the file either. The app has no way into your OneDrive until you upload the file or link Microsoft 365.", "A web search finds public pages. Your OneDrive is private, so a search cannot find the proposal.", "ChatGPT reads only what you give it and what it can open. Naming the file does not open it.", null], q:"ChatGPT cannot see a proposal saved in your OneDrive. What fixes it?",
      choices:["Choose a more capable model.", "Turn on web search.", "Name the file in your prompt.", "Upload the file, or link Microsoft 365 to ChatGPT."], correct:3,
      right:"Correct. The app could not read the file, and a different model cannot read it either.", wrong:"Not quite. The app could not read the file, and a different model cannot read it either. Upload it or link Microsoft 365."},
    {t:"kc", check:true, others:[null, "Custom instructions apply to every chat, not only the chats inside one workspace.", "A connector links the AI to another app, such as OneDrive. A connector is not a workspace for a set of chats.", "Memory saves a few facts about you for all your chats. Memory does not keep a file ready for one set of chats."], q:"Every chat inside a workspace called “Quarterly report” can read last quarter’s report. Chats outside it cannot. What is the workspace?",
      choices:["A project", "Custom instructions", "A connector", "Memory"], correct:0,
      right:"Correct. Only the chats inside the workspace get the file.", wrong:"Not quite. Only the chats inside the workspace get the file, so it is a project."},
    {t:"kc", check:true, others:["The knowledge cutoff limits what the model learned in training. You asked for the format in this chat, so the cutoff has nothing to do with it.", "Memory saves facts between chats. You asked for the format in this chat, and Claude followed it at first.", null, "If your custom instructions disagreed, Claude would have skipped the format from the start. Claude used your format earlier in this chat."], q:"You have used the same chat all afternoon. Claude no longer uses the format you asked for in your first message. What is the most likely cause?",
      choices:["Your request is newer than the model’s knowledge cutoff.", "Memory did not save the format.", "The chat got longer than the context window.", "Your custom instructions disagree with the format."], correct:2,
      right:"Correct. The chat grew too long for Claude to read all of it at once.", wrong:"Not quite. You gave the format in this chat, so the chat got longer than the context window."},
    {t:"kc", check:true, others:[null, "Today’s chat is new and short, so it is far from the end of the context window.", "The knowledge cutoff limits what the model learned in training. You told ChatGPT the fact yourself, in another chat.", "No model reads your other chats. A more capable model starts a new chat empty too."], q:"Yesterday you told ChatGPT that your client’s fiscal year ends in June. In a new chat today, ChatGPT does not know it. What is the most likely cause?",
      choices:["The new chat started empty, and memory did not save that fact.", "The chat got longer than the context window.", "The fact is newer than the model’s knowledge cutoff.", "ChatGPT needs a more capable model to remember it."], correct:0,
      right:"Correct. Each chat starts empty. To use that fact in every chat about the client, put it in the client’s project.", wrong:"Not quite. Today’s chat is new and short. Each chat starts empty, and memory did not save that fact. Put it in the client’s project."},
    {t:"kc", check:true, others:["A list of sources shows that ChatGPT searched. It does not show that the answer matches the sources.", null, "ChatGPT wrote the summary, so its own answer about the facts is not a check.", "A second answer can repeat the same mistake. Only the sources show what they say."], q:"ChatGPT answers with three web sources, and two of the facts will go into a client proposal. What do you check?",
      choices:["Nothing. The sources show it searched.", "Open the sources behind those two facts.", "Ask ChatGPT whether the two facts are right.", "Run the same search again and compare the answers."], correct:1,
      right:"Correct. The model wrote the summary and can misstate a source. Check the facts the client will rely on.", wrong:"Not quite. The model wrote the summary and can misstate a source. Open the sources behind the two facts going to the client."},
    {t:"kc", check:true, others:["Claude can say its summary is complete and still skip a requirement. You need a way to check the summary yourself.", "More thinking can help, but you still cannot see what Claude skipped.", "A summary can sound right and still skip a requirement or make one up.", null], q:"Claude summarizes a 60-page RFP you uploaded. What is the best check?",
      choices:["Ask Claude whether its summary is complete.", "Ask Claude to summarize the RFP again with more thinking.", "Read the summary and check that it sounds right.", "Ask Claude for the page of each requirement, and check a few against the RFP."], correct:3,
      right:"Correct. Page numbers let you find a skipped or made-up requirement.", wrong:"Not quite. Claude’s own answer about completeness is not a check. Ask for page numbers and compare a few with the RFP."},
    {t:"score", pass:5},
    {t:"cards", cards:[
      ["Prompt","Everything you send in one message: your request, instructions, examples and attached files."],
      ["Custom instructions","Saved directions the AI follows in every chat, such as your role, tone or preferred format."],
      ["Connector","A link that lets an AI tool read or change data in another app, such as Outlook, SharePoint or Notion."],
      ["MCP (Model Context Protocol)","A shared standard for building connectors, so one connector works with many AI tools."],
      ["Context window","The most text a model can read at one time: the whole chat, any files and its own replies."],
      ["Token","The unit AI apps use to measure text. One token is about three-quarters of an English word."],
      ["Memory","A feature that saves a few facts about you between chats. The app chooses what to save."],
      ["Knowledge cutoff","The date the model’s learning stops. The model does not know later events unless it searches or you tell it."],
      ["Hallucination","A false statement the AI gives as fact. It was never true."]]},
    {t:"end", html:`You can now choose where to put a direction and a file, find the cause when the AI seems to forget, and set up once what you can to prevent wrong answers. Post a question or something you tried in the ${a(L.teams,"Learning and practicing with AI tools")} channel in Teams. Lesson 3 shows how to let an agent do the work.`}
  ]
